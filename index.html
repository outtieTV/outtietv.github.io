<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Index</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
      padding: 1rem;
    }
    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 2rem;
    }
    h2 {
      color: #007acc;
      text-align: center;
      margin-top: 0;
    }
    /* Main layout container for side-by-side on desktop */
    .content-container {
      display: flex;
      flex-direction: column; /* Default vertical on mobile */
      gap: 20px;
      max-width: 1000px; /* Limit overall width */
      margin: 0 auto;
    }
    /* Individual tool/game container */
    .list-container {
      background: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      flex: 1; /* Allows containers to grow/shrink equally */
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 0.5rem 0;
      padding: 0.75rem 0;
      border-bottom: 1px solid #eee;
    }
    li:last-child {
      border-bottom: none;
    }
    a {
      text-decoration: none;
      color: #333;
      font-weight: normal;
      display: block; /* Make the whole li clickable/linkable area */
      transition: color 0.2s;
    }
    a:hover {
      color: #007acc;
      text-decoration: underline;
    }

    /* Media query for desktop/larger screens */
    @media (min-width: 768px) {
      .content-container {
        flex-direction: row; /* Horizontal on desktop */
      }
      .list-container {
        /* Ensure equal width on desktop */
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <h1>Project Index</h1>

  <div class="content-container">
    <div class="list-container" id="tools-container">
      <h2>Available Tools</h2>
      <ul id="tools-list"><li>Loading tools...</li></ul>
    </div>

    <div class="list-container" id="games-container">
      <h2>Available Games</h2>
      <ul id="games-list"><li>Loading games...</li></ul>
    </div>
  </div>

	<script>
	  /**
	   * Loads files from a specified JSON file and populates the given UL element.
	   * @param {string} jsonPath - Path to the JSON file (e.g., "./tools.json").
	   * @param {string} listId - The ID of the <ul> element to populate (e.g., "tools-list").
	   * @param {string} directory - The subdirectory where the linked files reside (e.g., "tools").
	   */
	  async function loadFiles(jsonPath, listId, directory) {
		const list = document.getElementById(listId);
		try {
		  const response = await fetch(jsonPath);
		  if (!response.ok) throw new Error(`Could not fetch ${jsonPath}`);
		  const files = await response.json();

		  list.innerHTML = ""; // Clear the 'Loading...' message

		  files.sort().forEach(file => { // auto sort alphabetically
			const li = document.createElement("li");
			const link = document.createElement("a");
			link.href = `./${directory}/${file}`;
			// Remove the extension for display text
			link.textContent = file.replace(/\.(html|htm)$/i, "");
			li.appendChild(link);
			list.appendChild(li);
		  });

		  // Show a message if no files are found
		  if (files.length === 0) {
			list.innerHTML = `<li>No ${directory} found.</li>`;
		  }

		} catch (err) {
		  console.error(err);
		  // Display a user-friendly error message
		  list.innerHTML = `<li>Could not load ${directory} list.</li>`;
		}
	  }

	  // Function to load both tools and games
	  function initialize() {
		// Load tools from ./tools.json into #tools-list, linking to ./tools/
		loadFiles("./tools.json", "tools-list", "tools");

		// Load games from ./games.json into #games-list, linking to ./games/
		loadFiles("./games.json", "games-list", "games");
	  }

	  initialize();
	</script>

</body>
</html>
