<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bubble Pop — HTML5 Game</title>
<style>
:root{
  --bg:#071022;
  --accent:#6ee7b7;
  --bubble-gloss: rgba(255,255,255,0.17);
  --pop-color:#ffd6e0;
}

html,body{
  height:100%;
  margin:0;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  background: radial-gradient(1200px 800px at 10% 10%, #0b2540 0%, #071022 35%, #03040a 100%);
  color: #eef6ff;
  -webkit-tap-highlight-color: transparent;
  overflow:hidden;
  user-select:none;
}

.game {
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

.counter {
  position: fixed;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.28);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.06);
  padding: 8px 12px;
  border-radius: 12px;
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:600;
  z-index: 2000;
  box-shadow: 0 6px 20px rgba(2,6,23,0.6);
}
.counter .label { font-size:12px; color:#bfe9d3; }
.counter .num { font-size:18px; color:var(--accent); min-width:2ch; text-align:right; }

/* Fullscreen button */
.fullscreen-btn {
  position: fixed;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,0.28);
  border: 1px solid rgba(255,255,255,0.06);
  padding: 8px 12px;
  border-radius: 12px;
  font-size:14px;
  cursor:pointer;
  z-index: 2000;
}
.fullscreen-btn:hover { background: rgba(0,0,0,0.4); }

.bubble {
  position: absolute;
  bottom: -160px;
  pointer-events:auto;
  border-radius: 50%;
  display:block;
  will-change: transform, opacity;
  transform-origin: center;
  box-shadow:
    inset -6px -12px 30px rgba(0,0,0,0.18),
    0 10px 30px rgba(2,6,23,0.6);
  cursor: pointer;
  z-index: 100;
}
.bubble::before{
  content:"";
  position:absolute;
  left:14%;
  top:10%;
  width:60%;
  height:48%;
  background: linear-gradient(135deg, var(--bubble-gloss), transparent 60%);
  border-radius: 50%;
  mix-blend-mode: screen;
  pointer-events:none;
}
.bubble::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  box-shadow: inset 0 0 24px rgba(255,255,255,0.03);
  pointer-events:none;
}
.bubble.pop {
  animation: popScale 260ms ease-out forwards;
  pointer-events:none;
}
@keyframes popScale {
  0% { transform: scale(1); opacity:1; }
  60% { transform: scale(1.6); opacity:0.9; }
  100% { transform: scale(0.03); opacity:0; }
}
@keyframes rise {
  0% { transform: translateY(0) translateX(0); }
  50% { transform: translateY(-50vh) translateX(var(--drift)); }
  100% { transform: translateY(-110vh) translateX(calc(var(--drift) * -1)); }
}
.instructions {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 18px;
  background: rgba(0,0,0,0.2);
  border-radius: 12px;
  padding: 8px 14px;
  font-size: 13px;
  color: #d9f7e9;
  z-index: 2000;
  display:flex;
  gap:10px;
  align-items:center;
  box-shadow: 0 8px 30px rgba(2,6,23,0.5);
}
@media (max-width:640px){
  .instructions{ font-size:12px; padding:6px 10px; bottom:12px; }
  .counter { padding:6px 10px; top:8px; right:8px; border-radius:10px; }
}
.particle {
  position: absolute;
  width:4px;
  height:4px;
  background: var(--pop-color);
  border-radius:50%;
  pointer-events:none;
  opacity:0.8;
}
</style>
</head>
<body>
<div class="game" id="game">
  <div class="counter" id="counter">
    <div class="label">Popped</div>
    <div class="num" id="poppedCount">0</div>
  </div>
  <button class="fullscreen-btn" id="fullscreenBtn">Fullscreen</button>
  <div class="instructions" id="instr">Tap or click bubbles to pop them!</div>
</div>

<script>
(() => {
  const game = document.getElementById('game');
  const poppedCountEl = document.getElementById('poppedCount');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  let popped = 0;
  let audioCtx;

  const spawnRate = 700;
  const minSize = 28;
  const maxSize = 120;
  const minDuration = 5200;
  const maxDuration = 12000;
  const maxConcurrent = 60;

  const rand = (min,max) => Math.random()*(max-min)+min;
  const randInt = (min,max) => Math.floor(rand(min,max+1));

  function playPopSound(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(rand(420,860),now);
      gain.gain.setValueAtTime(0.0001,now);
      gain.gain.exponentialRampToValueAtTime(0.2,now+0.005);
      gain.gain.exponentialRampToValueAtTime(0.001,now+0.18);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now+0.2);
    } catch(e){}
  }

  function createParticleBurst(x,y){
    const burstCount = randInt(6,12);
    for(let i=0;i<burstCount;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      game.appendChild(p);
      p.style.left = `${x}px`;
      p.style.top = `${y}px`;
      const angle = rand(0,Math.PI*2);
      const speed = rand(50,120);
      const duration = rand(400,800);
      const vx = Math.cos(angle)*speed;
      const vy = Math.sin(angle)*speed;
      p.style.transition = `transform ${duration}ms ease-out, opacity ${duration}ms ease-out`;
      requestAnimationFrame(()=>{
        p.style.transform = `translate(${vx}px,${vy}px) scale(0.5)`;
        p.style.opacity = '0';
      });
      setTimeout(()=>p.remove(),duration);
    }
  }

  function createBubble(initialX){
    const b = document.createElement('button');
    b.className='bubble';
    b.setAttribute('aria-label','bubble');
    const size=rand(minSize,maxSize);
    b.style.width=b.style.height=`${size}px`;
    const hue = Math.floor(rand(170,310));
    const sat = Math.floor(rand(60,92));
    const light = Math.floor(rand(56,86));
    b.style.background=`linear-gradient(180deg, hsla(${hue},${sat}%,${Math.min(light+6,96)}%,0.95), hsla(${hue},${sat}%,${Math.max(light-8,20)}%,0.85))`;
    b.style.border=`1px solid rgba(255,255,255,0.06)`;
    const vw = game.clientWidth;
    const left = typeof initialX==='number' ? initialX-size/2 : rand(-size*0.05,vw-size*0.9);
    b.style.left=`${Math.max(-size*0.1,Math.min(left,vw-size*0.9))}px`;
    const driftPx=rand(-vw*0.12,vw*0.12)+'px';
    b.style.setProperty('--drift',driftPx);
    const duration=rand(minDuration,maxDuration);
    b.style.animation=`rise ${duration}ms linear forwards`;
    b.style.animationDelay=rand(0,600)+'ms';
    let poppedAlready=false;
    function pop(e){
      if(poppedAlready)return;
      poppedAlready=true;
      b.classList.add('pop');
      playPopSound();
      popped++;
      poppedCountEl.textContent=popped;
      const rect=b.getBoundingClientRect();
      createParticleBurst(rect.left+size/2,rect.top+size/2);
      setTimeout(()=>{b.remove();},300);
      e&&e.stopPropagation&&e.stopPropagation();
    }
    b.addEventListener('click',pop,{passive:true});
    b.addEventListener('touchstart',(ev)=>{ev.preventDefault();pop(ev);},{passive:false});
    b.addEventListener('keydown',(ev)=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pop(ev);}});
    b.addEventListener('animationend',()=>{if(!poppedAlready)b.remove();});
    return b;
  }

  let spawnTimer=null;
  function spawnLoop(){
    const existing=game.querySelectorAll('.bubble').length;
    if(existing<maxConcurrent&&Math.random()>0.06){
      const bubble=createBubble();
      game.appendChild(bubble);
    }
    const delay=rand(spawnRate*0.6,spawnRate*1.6);
    spawnTimer=setTimeout(spawnLoop,delay);
  }

  function startGame(){
    if(spawnTimer)return;
    spawnLoop();
  }

  function oneTimeStart(){
    if(!audioCtx&&window.AudioContext){
      try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();}catch(e){}
    }
    document.removeEventListener('pointerdown',oneTimeStart);
    document.removeEventListener('touchstart',oneTimeStart);
    document.removeEventListener('keydown',oneTimeStart);
    startGame();
  }
  document.addEventListener('pointerdown',oneTimeStart,{passive:true});
  document.addEventListener('touchstart',oneTimeStart,{passive:true});
  document.addEventListener('keydown',oneTimeStart,{passive:true});

  game.addEventListener('pointerdown',(ev)=>{
    if(ev.target&&ev.target.classList&&ev.target.classList.contains('bubble'))return;
    const rect=game.getBoundingClientRect();
    const x=ev.clientX-rect.left;
    const bubble=createBubble(x);
    game.appendChild(bubble);
    startGame();
  },{passive:true});

  window.addEventListener('resize',()=>{
    const all=Array.from(document.querySelectorAll('.bubble'));
    const max=Math.max(35,Math.floor(window.innerWidth/10));
    if(all.length>max)all.slice(0,all.length-max).forEach(b=>b.remove());
  });

  for(let i=0;i<6;i++){
    setTimeout(()=>{
      if(!spawnTimer){
        const b=createBubble();
        game.appendChild(b);
      }
    },i*160);
  }

  fullscreenBtn.addEventListener('click',()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen();
    }else{
      document.exitFullscreen();
    }
  });

})();
</script>
</body>
</html>
