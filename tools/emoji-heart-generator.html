<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emoji Heart Generator</title>
<style>
    body{
        font-family:Arial,Helvetica,sans-serif;
        background:#fafafa;
        margin:0;
        padding:2rem;
        color:#333;
    }
    h1{
        text-align:center;
        margin-bottom:1rem;
    }
    .controls{
        max-width:500px;
        margin:0 auto 2rem;
        display:grid;
        gap:0.6rem;
    }
    label{
        font-weight:600;
    }
    input[type=text]{
        width:100%;
        padding:.4rem .6rem;
        font-size:1rem;
        border:1px solid #ccc;
        border-radius:4px;
    }
    button{
        padding:.6rem 1rem;
        font-size:1rem;
        background:#0064e1;
        color:#fff;
        border:none;
        border-radius:4px;
        cursor:pointer;
        transition:background .2s;
    }
    button:hover{background:#0050b8;}
    textarea{
        width:100%;
        height:300px;
        font-family:monospace;
        font-size:1.1rem;
        line-height:1.4;
        margin-top:1rem;
        padding:.8rem;
        border:1px solid #bbb;
        border-radius:4px;
        resize:vertical;
        background:#fff;
    }
</style>
</head>
<body>

<h1>❤️ Emoji Heart Artwork Generator</h1>

<div class="controls">
    <label>Corner emoji
        <input id="corner" type="text" placeholder="e.g. :lovesweetheart:" value="❤️">
    </label>
    <label>Primary heart color emoji
        <input id="primary" type="text" placeholder="e.g. :fcspark:" value="💖">
    </label>
    <label>Secondary heart color emoji
        <input id="secondary" type="text" placeholder="e.g. :star_yellow:" value="💛">
    </label>
    <label>Surrounding emoji
        <input id="surround" type="text" placeholder="e.g. :gwhat:" value="✨">
    </label>
    <button id="make">Generate Artwork</button>
    <button id="copy">Copy to Clipboard</button>
</div>

<textarea id="output" readonly placeholder="Your artwork will appear here…"></textarea>

<script>
/* ----- template using placeholder tokens -----
   Tokens:
   C – corner
   P – primary heart
   S – secondary heart
   X – surrounding (extra) emoji
*/
const TEMPLATE = [
    "C P X X X X X P C",
    "P X C C X C C X P",
    "X C S P C P S C X",
    "X C P C S C P C X",
    "X X C P C P C X X",
    "X X X C S C X X X",
    "P X X X C X X X P",
    "C P X X X X X P C"
];

function generate(){
    const map = {
        C: document.getElementById('corner').value.trim()   || '',
        P: document.getElementById('primary').value.trim()  || '',
        S: document.getElementById('secondary').value.trim()|| '',
        X: document.getElementById('surround').value.trim() || ''
    };

    const lines = TEMPLATE.map(row=>{
        // split by space, replace each token by its emoji, then join back
        return row.split(' ').map(tok=>map[tok]||tok).join('');
    });
    document.getElementById('output').value = lines.join('\n');
}

/* copy button */
function copyToClipboard(){
    const txt = document.getElementById('output');
    txt.select();
    txt.setSelectionRange(0,99999); // for mobile
    navigator.clipboard.writeText(txt.value).catch(()=>{});
}

/* event listeners */
document.getElementById('make').addEventListener('click', generate);
document.getElementById('copy').addEventListener('click', copyToClipboard);

/* generate once on load (with defaults) */
generate();
</script>

</body>
</html>
