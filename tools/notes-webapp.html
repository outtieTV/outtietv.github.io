<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OuttieTV's Notes Webapp</title>
<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
<style>
/* --- Styles: Layout, Theme Variables, and Components --- */
:root{--bg:#f5f5f5;--text:#111;--card:#fff;--muted:#6a6a6a;--accent:#4a90e2;--header:#e9e9e9;--border:#d1d1d1;--hover:#e0e0e0;--red:#e24a4a;--green:#4ae24a}
[data-theme="dark"]{--bg:#141414;--text:#eaeaea;--card:#1f1f1f;--muted:#9a9a9a;--accent:#7fbfff;--header:#2a2a2a;--border:#333;--hover:#2f2f2f;--red:#ff7f7f;--green:#7fff7f}

body{margin:0;font-family:Segoe UI,Inter,system-ui;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

/* Sidebar & Layout - Default (Desktop) */
.sidebar{
    width:260px;
    background:var(--card);
    border-right:1px solid var(--border);
    padding:16px;
    /* Add transition for all properties */
    transition:transform .3s ease-in-out, margin-left .3s ease-in-out, visibility 0s; 
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    z-index: 50; 
}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.main{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}

/* General UI */
button, select, input, textarea{font:inherit;border-radius:8px;box-sizing:border-box}
button{cursor:pointer;transition:.1s}
.btn{background:var(--accent);color:#fff;border:none;padding:8px 12px}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.secondary:hover{background:var(--hover)}
.btn.danger{background:var(--red);color:#fff;border:none}
.btn.success{background:var(--green);color:#111;border:none}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:60;padding:40px 20px;overflow-y:auto}
.modal.open{display:block}
.modal-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    max-width:800px;
    margin:0 auto;
    padding:20px;
    color:var(--text);
    width:100%;
}

/* Notes List (Desktop/Tablet) */
.markdown-preview{border:1px solid var(--border);padding:10px;margin-top:10px;border-radius:8px;max-height:250px;overflow:auto}
.note-item{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 3fr 80px 80px;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    cursor:pointer;
    align-items:center;
}
.note-item.header{background:var(--header);font-weight:700;position:sticky;top:0;cursor:default}
.note-item > div:nth-child(4) { /* Note Body */
    max-height:110px;
    overflow:hidden;
}
.date-label { display: none; } 
.note-actions-wrapper { display: flex; gap: 4px; }


/* Folder Tree View */
#folders-container{display:flex;flex-direction:column;gap:4px;flex-grow:1;overflow-y:auto;margin-top:16px;padding-right:4px}
.folder-item{display:flex;flex-direction:column;padding-left:0;border-left:none}
.folder-header{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:6px;cursor:pointer}
.folder-header:hover{background:var(--hover)}
.folder-item.active > .folder-header{background:var(--accent);color:#fff}
.folder-name-wrapper{display:flex;align-items:center;flex-grow:1;min-width:0;overflow:hidden; gap: 8px;} /* ADDED gap: 8px */
.folder-name{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    /* REMOVED: all text-shadow and color overrides */
}
.folder-item.active .folder-name{
    color: #fff !important; 
    text-shadow: none;
}
.folder-color-swatch {
    width: 14px; /* Size of the square */
    height: 14px;
    border-radius: 3px;
    border: 1px solid var(--border);
    flex-shrink: 0; /* Prevents it from shrinking */
}
.folder-actions{display:flex;gap:4px;margin-left:8px}
.folder-actions button{background:transparent;border:none;color:var(--muted);padding:0 4px;font-size:1.1em;line-height:1;transition:none}
.folder-item.active .folder-actions button{color:#fff}
.folder-children{padding-left:16px;display:none;overflow:hidden}
.folder-item.open > .folder-children{display:block}
.folder-expand-btn{margin-right:4px;font-size:1.2em;line-height:1;width:1.2em;height:1.2em;text-align:center}

/* Desktop Specific Styles */
@media (min-width: 769px) {
    /* Hide the mobile toggle button on desktop */
    #mobile-toggle-btn { display: none; } 
    /* Desktop collapse behavior */
    .sidebar.collapsed{
        transform: translateX(-260px);
        margin-left: -260px;
    }
}


/* --- Mobile Specific Styles (Overlay) --- */
@media (max-width: 768px) {
    /* Show the mobile toggle button */
    #mobile-toggle-btn { 
        display: inline-block; 
        /* Match other secondary buttons */
        background: transparent; 
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 12px;
        margin-right: 8px; /* Space between burger and other buttons */
    }

    /* Sidebar as fixed overlay, hidden by default */
    .sidebar {
        position: fixed;
        height: 100vh;
        top: 0;
        left: 0;
        /* Move off-screen */
        transform: translateX(-260px); 
        /* Hide it completely. Delay the visibility transition until AFTER the transform is finished */
        visibility: hidden; 
        transition: transform .3s ease-in-out, visibility 0s .3s; 
        margin-left: 0; 
        box-shadow: 2px 0 5px rgba(0,0,0,0.5); 
    }
    
    /* When not collapsed (i.e., open) */
    .sidebar:not(.collapsed) {
        transform: translateX(0); /* Slide into view */
        visibility: visible;
        /* Make it visible immediately, then slide */
        transition: transform .3s ease-in-out, visibility 0s; 
    }
    
    /* Modal adjustments for full-screen on small devices */
    .modal-card {
        max-width: 100%;
        margin: 10px;
        border-radius: 6px;
        padding: 15px;
        max-height: 95vh;
    }

    /* Note List Redesign for Mobile */
    .note-item {
        grid-template-columns: 1fr auto; 
        grid-template-rows: auto auto auto auto; 
        padding: 8px;
        gap: 0;
    }
    .note-item.header {
        display: none; 
    }

    /* 1. Title */
    .note-item > div:nth-child(1) { grid-column: 1 / 2; }
    /* 2. Created, 3. Edited (Dates stacked) */
    .note-item > div:nth-child(2) { grid-column: 2 / 3; grid-row: 1 / 2; }
    .note-item > div:nth-child(3) { grid-column: 2 / 3; grid-row: 2 / 3; }
    /* 4. Note Body */
    .note-item > div:nth-child(4) { 
        grid-column: 1 / 3; 
        grid-row: 3 / 4; 
        padding-top: 6px;
    }
    /* 5. View, 6. Actions (Combined into one wrapper) */
    .note-actions-wrapper {
        grid-column: 1 / 3;
        grid-row: 4 / 5;
    }
}
/* Always show hamburger when sidebar is collapsed */
#mobile-toggle-btn {
    display: inline-block !important;
    order: -1; /* move left of title */
    margin-right: 8px;
}

.sidebar:not(.collapsed) ~ .main #mobile-toggle-btn {
    display: none !important; /* hide when sidebar is open on large screens */
}

/* Adjust title + hamburger layout */
.main > div:first-child {
    display: flex;
    align-items: center;
    gap: 8px;
}
</style>
</head>
<body data-theme="light">
<div id="sidebar" class="sidebar collapsed"> 
  <div class="topbar">
    <strong>OuttieTV's Notes Webapp</strong>
    <button id="sidebar-close-btn" class="btn secondary">✕</button>
  </div>
  <div style="display:flex;gap:8px;margin-top:auto">
    <button id="add-root-folder-btn" class="btn secondary" style="width:100%">➕ Folder</button>
  </div>
  <button id="all-notes-btn" class="btn secondary" style="width:100%">📂 All Notes</button>
  <div id="folders-container"></div>
</div>

<div class="main">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
    <button id="mobile-toggle-btn" class="btn secondary">☰</button> 
	<h2 id="current-folder-title">All Notes</h2>
	<div>
      <button id="add-note-btn" class="btn">➕ Add Note</button>
      <button id="settings-btn" class="btn secondary">⚙️</button>
    </div>
  </div>

  <div id="notes-container" class="notes-container" style="flex-grow:1;overflow-y:auto;min-height:0">
    <div class="note-item header">
      <div>NOTE TITLE</div><div>CREATED</div><div>EDITED</div><div>NOTE</div><div>VIEW</div><div>ACTIONS</div>
    </div>
  </div>
</div>

<div id="settings-modal" class="modal">
  <div class="modal-card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>Settings</h3><button class="close-btn btn secondary" data-close="settings-modal">✕</button>
    </div>
    
    <h4 style="margin-top:16px">Display</h4>
    <label>Theme:</label>
    <button id="theme-toggle" class="btn secondary" style="width:100%;margin-top:6px">Toggle Theme</button>
    
    <label style="margin-top:16px">Time Zone for Dates:</label>
    <select id="timezone-select" style="width:100%;padding:8px;margin-top:4px"></select>

    <h4 style="margin-top:16px">Data Management</h4>
    <div style="display:flex;gap:8px">
        <button id="export-data-btn" class="btn secondary" style="width:100%">⬇️ Export JSON</button>
        <button id="import-data-btn" class="btn secondary" style="width:100%">⬆️ Import JSON</button>
    </div>
    <input type="file" id="import-file-input" accept=".json" style="display:none">
  </div>
</div>

<div id="note-modal" class="modal">
  <div class="modal-card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>Edit Note</h3><button class="close-btn btn secondary" data-close="note-modal">✕</button>
    </div>
    <label>Title</label>
    <input id="note-title-input" type="text" style="width:100%;margin-top:4px;padding:8px">
    <label style="margin-top:10px">Folder</label>
    <select id="note-folder-select" style="width:100%;padding:8px"></select>
    <label style="margin-top:10px">Content</label>
    <textarea id="note-content-input" rows="8" style="width:100%;padding:8px"></textarea>
    <div id="edit-markdown-preview" class="markdown-preview"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
      <button id="delete-note-btn" class="btn danger">🗑️ Delete</button>
      <button id="save-note-btn" class="btn success">💾 Save</button>
    </div>
  </div>
</div>

<div id="view-modal" class="modal">
  <div class="modal-card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 id="view-title">View Note</h3>
      <div>
        <button id="copy-note-btn" class="btn secondary">📋 Copy</button>
        <button class="close-btn btn secondary" data-close="view-modal">✕</button>
      </div>
    </div>
    <div id="view-content" class="markdown-preview" style="max-height:70vh;overflow:auto"></div>
  </div>
</div>

<script>
const NOTES_KEY = 'notes_app_v2';
const FOLDERS_KEY = 'folders_app_v2';
const TIMEZONE_KEY = 'timezone_app_v2';
const THEME_KEY = 'theme_app_v2';
const MOBILE_BREAKPOINT = 768;

let notes = []; 
let folders = []; 
let activeFolder = null; 
let timezone = Intl.DateTimeFormat().resolvedOptions().timeZone; 

// --- Core Data & Storage ---

function save() {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
    localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders));
    localStorage.setItem(TIMEZONE_KEY, timezone);
    localStorage.setItem(THEME_KEY, document.body.dataset.theme);
}

function load() {
    notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]');
    folders = JSON.parse(localStorage.getItem(FOLDERS_KEY) || '[]');
    timezone = localStorage.getItem(TIMEZONE_KEY) || Intl.DateTimeFormat().resolvedOptions().timeZone;
    const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
    document.body.dataset.theme = savedTheme;
}

// --- Utility Functions ---

function format(t) {
    if (!t) return '—';
    return new Date(t).toLocaleString('default', { timeZone: timezone });
}

function closeModal(id) {
    document.getElementById(id).classList.remove('open');
}

function findFolder(id) {
    return folders.find(f => f.id === id);
}

// --- Folder Management & Rendering (Recursive) ---

function buildFolderTree(parentId = null) {
    const children = folders.filter(f => (f.parentId || null) === parentId);
    return children.map(folder => ({
        ...folder,
        children: buildFolderTree(folder.id)
    })).sort((a, b) => a.name.localeCompare(b.name));
}

function renderFolderTreeRecursive(tree, container) {
    tree.forEach(folder => {
        const item = document.createElement('div');
        item.className = 'folder-item';
        if (folder.id === activeFolder) {
            item.classList.add('active');
        }

        const header = document.createElement('div');
        header.className = 'folder-header';
        
        // Expansion Button
        const expandBtn = document.createElement('button');
        expandBtn.className = 'folder-expand-btn btn secondary';
        expandBtn.innerHTML = '▶'; 
        expandBtn.style.visibility = folder.children.length > 0 ? 'visible' : 'hidden';
        expandBtn.onclick = (e) => {
            e.stopPropagation();
            item.classList.toggle('open');
            expandBtn.innerHTML = item.classList.contains('open') ? '▼' : '▶';
        };
        header.appendChild(expandBtn);

        // Name and Wrapper
        const nameWrapper = document.createElement('div');
        nameWrapper.className = 'folder-name-wrapper';

        // --- NEW: Folder Color Swatch ---
        const colorSwatch = document.createElement('div');
        colorSwatch.className = 'folder-color-swatch';
        colorSwatch.style.backgroundColor = folder.color || 'var(--accent)';
        nameWrapper.appendChild(colorSwatch);
        // --- END NEW ---

		// Folder Name Element
        const folderName = document.createElement('strong');
        folderName.className = 'folder-name';
        folderName.textContent = folder.name;
        // --- NEW LINE ADDED HERE ---
        folderName.title = folder.name; // This shows the full title on hover
        // ---------------------------
        nameWrapper.appendChild(folderName);

        nameWrapper.onclick = (e) => {
            e.stopPropagation();
            setActiveFolder(folder.id);
        };
        header.appendChild(nameWrapper);

        // Actions
        const actions = document.createElement('div');
        actions.className = 'folder-actions';

        // Add Subfolder Button
        const addSubBtn = document.createElement('button');
        addSubBtn.title = 'Add Subfolder';
        addSubBtn.innerHTML = '➕';
        addSubBtn.onclick = (e) => {
            e.stopPropagation();
            addFolder(folder.id);
        };
        actions.appendChild(addSubBtn);

        // Rename Button
        const renameBtn = document.createElement('button');
        renameBtn.title = 'Rename Folder';
        renameBtn.innerHTML = '✏️';
        renameBtn.onclick = (e) => {
            e.stopPropagation();
            renameFolder(folder.id);
        };
        actions.appendChild(renameBtn);

        // Delete Button
        const deleteBtn = document.createElement('button');
        deleteBtn.title = 'Delete Folder';
        deleteBtn.innerHTML = '🗑️';
        deleteBtn.onclick = (e) => {
            e.stopPropagation();
            deleteFolder(folder.id);
        };
        actions.appendChild(deleteBtn);

        header.appendChild(actions);
        item.appendChild(header);
        
        // --- REMOVED: Logic to apply folder.color to header/nameWrapper background ---


        // Children Container
        if (folder.children.length > 0) {
            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'folder-children';
            renderFolderTreeRecursive(folder.children, childrenContainer);
            item.appendChild(childrenContainer);
        }

        container.appendChild(item);
    });
}

function renderFolders() {
    const fContainer = document.getElementById('folders-container');
    fContainer.innerHTML = '';
    const tree = buildFolderTree();
    renderFolderTreeRecursive(tree, fContainer);
    
    // Update 'All Notes' button style
    const allNotesBtn = document.getElementById('all-notes-btn');
    
    // Reset styles
    allNotesBtn.classList.add('secondary');
    allNotesBtn.style.background = '';
    allNotesBtn.style.color = 'var(--text)';
    
    if (activeFolder === null) {
        allNotesBtn.style.background = 'var(--accent)';
        allNotesBtn.style.color = '#fff';
    }

    updateFolderTitle();
    populateFolderSelect();
}

function setActiveFolder(folderId) {
    activeFolder = folderId;
    save(); 
    renderFolders();
    renderNotes();
    // On mobile, collapse sidebar when a folder/view is selected
    if (window.innerWidth <= MOBILE_BREAKPOINT) {
        document.getElementById('sidebar').classList.add('collapsed');
    }
}

function updateFolderTitle() {
    const title = activeFolder ? (findFolder(activeFolder)?.name || 'Folder Not Found') : 'All Notes';
    document.getElementById('current-folder-title').textContent = title;
}

function addFolder(parentId = null) {
    const name = prompt('Enter folder name:');
    if (!name) return;
    const color = prompt('Enter folder color (hex or name), leave blank for default:', '#4a90e2') || '#4a90e2';
    const newFolder = { id: Date.now().toString(), name: name.trim(), color, parentId };
    folders.push(newFolder);
    save();
    renderFolders();
    if (parentId === null) {
        setActiveFolder(newFolder.id);
    }
}

function renameFolder(id) {
    const folder = findFolder(id);
    if (!folder) return;

    // 1. Prompt for new name
    const newName = prompt('Rename folder:', folder.name);
    //if (!newName || newName.trim() === folder.name) return; // Exit if canceled or name is unchanged

    // 2. Prompt for new color
    const newColor = prompt('Change folder color (hex or name):', folder.color);
    // Exit if canceled and color is unchanged, or if name was already empty (handled above)
    //if (newColor === null && newName.trim() === folder.name && newColor === folder.color) return;


    // Apply changes only if the value is different (and not null for color, or not empty for name)
    let changed = false;

    if (newName.trim() !== folder.name) {
        folder.name = newName.trim();
        changed = true;
    }
    
    // Only update color if a value was provided/changed
    if (newColor !== null && newColor.trim() !== folder.color) {
        folder.color = newColor.trim() || '#4a90e2'; // Use default if they clear the color prompt
        changed = true;
    }

    if (changed) {
        save();
        renderFolders();
    }
}

function deleteFolder(id) {
    const folder = findFolder(id);
    if (!folder) return;

    if (!confirm(`Are you sure you want to delete the folder "${folder.name}" and ALL its contents (subfolders and notes)?`)) return;

    const getDescendantIds = (parentId) => {
        const children = folders.filter(f => f.parentId === parentId);
        let ids = children.map(f => f.id);
        children.forEach(f => {
            ids = ids.concat(getDescendantIds(f.id));
        });
        return ids;
    };

    const idsToDelete = [id].concat(getDescendantIds(id));
    
    notes = notes.filter(n => !idsToDelete.includes(n.folder));
    folders = folders.filter(f => !idsToDelete.includes(f.id));

    if (activeFolder && idsToDelete.includes(activeFolder)) {
        activeFolder = null;
    }

    save();
    renderFolders();
    renderNotes();
}

// --- Note List Rendering ---
function handleNoteModalClose(noteId) {
    const n = notes.find(x => x.id === noteId);

    // Only delete the note if it was newly created and has not been saved/edited.
    // An unsaved note is defined as one where 'editedAt' is null.
    if (n && n.editedAt === null && n.content === '' && n.title.trim() === '') {
        notes = notes.filter(a => a.id !== noteId);
        save();
        renderNotes();
    }
    
    closeModal('note-modal');
}
function renderNotes() {
    const c = document.getElementById('notes-container');
    while (c.children.length > 1) c.removeChild(c.lastChild);

    let filtered = [];
    if (activeFolder === null) {
        filtered = notes.slice().sort((a, b) => (b.editedAt || b.createdAt) - (a.editedAt || a.createdAt));

    } else {
        const activeFolderAndDescendants = [activeFolder].concat(getDescendantIds(activeFolder));
        filtered = notes.filter(n => activeFolderAndDescendants.includes(n.folder))
                        .sort((a, b) => (b.editedAt || b.createdAt) - (a.editedAt || a.createdAt));
    }
    
    if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.style.textAlign = 'center';
        empty.style.padding = '20px';
        empty.style.color = 'var(--muted)';
        empty.textContent = activeFolder ? 'This folder is empty. Create a new note!' : 'No notes found. Create your first note!';
        c.appendChild(empty);
    }

    filtered.forEach(n => {
        const d = document.createElement('div');
        d.className = 'note-item';
        const previewText = n.content ? marked.parse(n.content.slice(0, 300)) : '<em>No content...</em>';
        d.innerHTML = `
            <div><strong>${n.title}</strong></div>
            <div><span class="date-label">Created:</span> ${format(n.createdAt)}</div>
            <div><span class="date-label">Edited:</span> ${format(n.editedAt)}</div>
            <div>${previewText}</div>
            <div class="note-actions-wrapper">
                <button class="btn secondary view-btn" title="View Note">👁️</button>
                <button class="btn edit-btn" title="Edit Note">⚙️</button>
            </div>
            <div></div> 
            <div></div> 
        `;
        
        d.querySelector('.view-btn').onclick = e => { e.stopPropagation(); openView(n.id); };
        d.querySelector('.edit-btn').onclick = e => { e.stopPropagation(); openEdit(n.id); };
        d.onclick = () => openEdit(n.id);
        
        c.appendChild(d);
    });
}

const getDescendantIds = (parentId) => {
    const children = folders.filter(f => f.parentId === parentId);
    let ids = children.map(f => f.id);
    children.forEach(f => {
        ids = ids.concat(getDescendantIds(f.id));
    });
    return ids;
};

// --- Note Editor & View Modals ---

function buildFolderSelectOptions(tree, level, options) {
    const prefix = '— '.repeat(level);
    tree.forEach(folder => {
        options.push(`<option value="${folder.id}">${prefix}${folder.name}</option>`);
        if (folder.children.length > 0) {
            buildFolderSelectOptions(folder.children, level + 1, options);
        }
    });
}

function populateFolderSelect() {
    const sel = document.getElementById('note-folder-select');
    let options = ['<option value="">(No Folder)</option>'];
    const tree = buildFolderTree();
    buildFolderSelectOptions(tree, 0, options);
    sel.innerHTML = options.join('');
}

function addNote() {
    const now = Date.now();
    // Set title to empty string temporarily, editedAt to null.
    const note = { id: now.toString(), title: '', content: '', createdAt: now, editedAt: null, folder: activeFolder };
    notes.unshift(note);
    save();
    renderNotes();
    openEdit(note.id);
}

function openEdit(id) {
    const n = notes.find(x => x.id === id);
    if (!n) return;
    
    populateFolderSelect(); 
    const modal = document.getElementById('note-modal');
    
    document.getElementById('note-title-input').value = n.title;
    document.getElementById('note-content-input').value = n.content;
    document.getElementById('note-folder-select').value = n.folder || '';
    
    updatePreview(n.content);

    document.getElementById('save-note-btn').onclick = () => saveNote(n.id);
    document.getElementById('delete-note-btn').onclick = () => {
        if (confirm('Permanently delete this note?')) {
            notes = notes.filter(a => a.id !== n.id);
            save();
            closeModal('note-modal');
            renderNotes();
        }
    };
    
    // --- NEW CLOSE BUTTON LOGIC ---
    document.querySelector('#note-modal .close-btn').onclick = (e) => handleNoteModalClose(n.id);
    // --- END NEW CLOSE BUTTON LOGIC ---

    modal.classList.add('open');
}

function saveNote(id) {
    const n = notes.find(x => x.id === id);
    if (!n) return;

    const title = document.getElementById('note-title-input').value.trim() || 'Untitled';
    const content = document.getElementById('note-content-input').value;
    const folder = document.getElementById('note-folder-select').value || null;

    const titleChanged = title !== n.title;
    const contentChanged = content !== n.content;
    const folderChanged = folder !== n.folder; // Not strictly needed for edit timestamp but good practice

    n.title = title;
    n.content = content;
    n.folder = folder;

    // Check if any significant data has changed
    if (titleChanged || contentChanged || folderChanged) {
        // Only update editedAt if the note is an existing note OR if this is the first save of a new note with content
        // We set editedAt to Date.now() if it's the first save and content is present, otherwise we leave it null for cleanup.
        if (n.createdAt === n.editedAt || n.editedAt !== null || n.content.length > 0 || n.title !== 'Untitled') {
             n.editedAt = Date.now();
        }
    }

    // Ensure editedAt is set if there is content, even on first save.
    if (n.content.length > 0 && n.editedAt === null) {
        n.editedAt = Date.now();
    }
    
    // Fallback title for completely empty notes
    if (n.title.trim() === '') {
        n.title = 'Untitled';
    }


    save();
    renderNotes();
    closeModal('note-modal');
}

function updatePreview(md) {
    document.getElementById('edit-markdown-preview').innerHTML = marked.parse(md || '');
}

function openView(id) {
    const n = notes.find(x => x.id === id);
    if (!n) return;
    
    document.getElementById('view-title').textContent = n.title;
    document.getElementById('view-content').innerHTML = marked.parse(n.content || '');
    document.getElementById('view-modal').classList.add('open');
    
    document.getElementById('copy-note-btn').onclick = () => {
        navigator.clipboard.writeText(n.content || '');
        alert('Note content copied to clipboard!');
    };
}

// --- Settings and Import/Export ---

function populateTimezoneSelect() {
    const sel = document.getElementById('timezone-select');
    try {
        const timeZones = Intl.supportedValuesOf('timeZone');
        const options = timeZones.map(tz => `<option value="${tz}" ${tz === timezone ? 'selected' : ''}>${tz}</option>`);
        sel.innerHTML = options.join('');
        sel.onchange = (e) => {
            timezone = e.target.value;
            save();
            renderNotes(); 
        };
    } catch (e) {
        sel.innerHTML = `<option value="${timezone}">${timezone} (System Default)</option><option value="UTC">UTC</option>`;
        console.error("Timezone selection feature not fully supported by the browser.", e);
    }
}

function exportData() {
    const data = {
        folders: folders,
        notes: notes,
        theme: document.body.dataset.theme,
        timezone: timezone,
        version: 2 
    };
    
    const jsonString = JSON.stringify(data, null, 2);
    const blob = new Blob([jsonString], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `markdown-notes-export-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function triggerImport() {
    document.getElementById('import-file-input').click();
}

function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.folders || !data.notes) {
                alert('Invalid file format. Missing "folders" or "notes" data.');
                return;
            }

            const confirmReplace = confirm("Importing data will REPLACE your existing notes and folders. Are you sure you want to proceed?");

            if (confirmReplace) {
                notes = data.notes;
                folders = data.folders;
                
                if (data.theme) document.body.dataset.theme = data.theme;
                if (data.timezone) timezone = data.timezone;
                
                activeFolder = null; 
                
                save();
                load(); 
                renderFolders();
                renderNotes();
                populateTimezoneSelect();
                alert('Data successfully imported!');
                closeModal('settings-modal');
            }
        } catch (error) {
            alert('Error processing file. Please ensure it is a valid JSON export file.');
            console.error('Import error:', error);
        }
    };
    reader.readAsText(file);
    event.target.value = ''; 
}

// --- Event Listeners and Initialization ---

// Sidebar Toggle Function (Handles Desktop Toggle and Mobile Close)
function toggleSidebarState() {
    const sidebar = document.getElementById('sidebar');
    
    // Desktop: simple toggle (slides in-flow)
    if (window.innerWidth > MOBILE_BREAKPOINT) {
        sidebar.classList.toggle('collapsed');
        document.getElementById('sidebar-close-btn').innerHTML = sidebar.classList.contains('collapsed') ? '☰' : '✕';
    } else {
        // Mobile: only allows closing (removes overlay)
        sidebar.classList.add('collapsed');
    }
}

// Open Sidebar function (used by the new mobile hamburger button)
function openSidebar() {
    document.getElementById('sidebar').classList.remove('collapsed');
}

// Initial setup function to handle desktop/mobile state
function initialLayoutCheck() {
    const sidebar = document.getElementById('sidebar');
    const closeBtn = document.getElementById('sidebar-close-btn');

    if (window.innerWidth <= MOBILE_BREAKPOINT) {
        // Mobile: Ensure it is collapsed (hidden overlay)
        sidebar.classList.add('collapsed');
        closeBtn.innerHTML = '✕'; 
    } else {
        // Desktop: Ensure it is open (in flow) and the close button shows '✕' to start
        sidebar.classList.remove('collapsed');
        closeBtn.innerHTML = '✕'; 
    }
}


// Listeners
document.getElementById('note-content-input').addEventListener('input', e => updatePreview(e.target.value));
document.querySelectorAll('.modal:not(#note-modal) .close-btn').forEach(b => b.onclick = e => closeModal(e.target.dataset.close));
document.getElementById('add-note-btn').onclick = addNote;
document.getElementById('all-notes-btn').onclick = () => setActiveFolder(null);
document.getElementById('settings-btn').onclick = () => document.getElementById('settings-modal').classList.add('open');
document.getElementById('theme-toggle').onclick = () => {
    document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
    save();
};
document.getElementById('export-data-btn').onclick = exportData;
document.getElementById('import-data-btn').onclick = triggerImport;
document.getElementById('import-file-input').onchange = handleImport;
document.getElementById('add-root-folder-btn').onclick = () => addFolder(null);

// Sidebar Listeners
document.getElementById('sidebar-close-btn').onclick = toggleSidebarState; 
document.getElementById('mobile-toggle-btn').onclick = openSidebar;

// Initialization
load();
populateTimezoneSelect();
renderFolders();
renderNotes();
initialLayoutCheck();

// Re-check layout on window resize (e.g., rotating phone)
window.addEventListener('resize', initialLayoutCheck);
</script>
