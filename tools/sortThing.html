<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Sorter and Organizer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the scrollbar to make it look nicer */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; /* slate-100 */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; /* slate-300 */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; /* slate-400 */
        }
        body {
            font-family: "Inter", sans-serif;
			background-color: #bdd4e7;
			background-image: linear-gradient(315deg, #bdd4e7 0%, #8693ab 74%);

        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-5xl flex flex-col lg:flex-row gap-8 transform transition-all duration-300 hover:shadow-3xl">
        <!-- Left Half: Input Controls -->
        <div class="flex-1 space-y-6">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-6 text-center lg:text-left">List Input & Sorting Options</h1>

            <div>
                <label for="inputList" class="block text-lg font-semibold text-gray-700 mb-2">Input List:</label>
                <textarea
                    id="inputList"
                    rows="10"
                    placeholder="Enter your list items here, separated by the input separator (e.g., apple,banana,cherry)"
                    class="w-full p-4 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 text-gray-800 bg-gray-50 resize-y"
                ></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="inputSeparator" class="block text-lg font-semibold text-gray-700 mb-2">Input Separator:</label>
                    <input
                        type="text"
                        id="inputSeparator"
                        value=","
                        placeholder="e.g. comma, semicolon, space, or &#92;n (newline)"
                        class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 text-gray-800 bg-gray-50"
                    >
                    <p class="text-sm text-gray-500 mt-1">Use `\n` for a newline.</p>
                </div>

                <div>
                    <label for="outputSeparator" class="block text-lg font-semibold text-gray-700 mb-2">Output Separator:</label>
                    <input
                        type="text"
                        id="outputSeparator"
                        value="\n"
                        placeholder="e.g. comma, semicolon, space, or &#92;n (newline)"
                        class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 text-gray-800 bg-gray-50"
                    >
                    <p class="text-sm text-gray-500 mt-1">Use `\n` for a newline.</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <input
                    type="checkbox"
                    id="deduplicate"
                    class="h-5 w-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                >
                <label for="deduplicate" class="text-lg font-semibold text-gray-700">Deduplicate List</label>
            </div>

            <div>
                <label for="capitalization" class="block text-lg font-semibold text-gray-700 mb-2">Capitalization:</label>
                <select
                    id="capitalization"
                    class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 text-gray-800 bg-gray-50 appearance-none"
                >
                    <option value="none">No Change</option>
                    <option value="capitalizeFirst">Capitalize First Letter</option>
                    <option value="uppercase">ALL CAPS</option>
                    <option value="lowercase">all lowercase</option>
                </select>
            </div>

            <div>
                <label for="sortOrder" class="block text-lg font-semibold text-gray-700 mb-2">Sort Order:</label>
                <select
                    id="sortOrder"
                    class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 text-gray-800 bg-gray-50 appearance-none"
                >
                    <option value="ascending">Ascending (A-Z)</option>
                    <option value="descending">Descending (Z-A)</option>
                </select>
            </div>

            <button
                id="sortButton"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300"
            >
                Sort List
            </button>
        </div>

        <!-- Right Half: Output -->
        <div class="flex-1 space-y-6">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-6 text-center lg:text-left">Sorted Output</h1>
            <div>
                <label for="outputList" class="block text-lg font-semibold text-gray-700 mb-2">Sorted List:</label>
                <textarea
                    id="outputList"
                    rows="15"
                    readonly
                    class="w-full p-4 border border-gray-300 rounded-lg shadow-sm bg-gray-100 text-gray-800 resize-y"
                    placeholder="Your sorted list will appear here."
                ></textarea>
            </div>
        </div>
    </div>

    <script>
        // Get references to DOM elements
        const inputListEl = document.getElementById('inputList');
        const inputSeparatorEl = document.getElementById('inputSeparator');
        const outputSeparatorEl = document.getElementById('outputSeparator');
        const deduplicateEl = document.getElementById('deduplicate');
        const capitalizationEl = document.getElementById('capitalization');
        const sortOrderEl = document.getElementById('sortOrder');
        const sortButtonEl = document.getElementById('sortButton');
        const outputListEl = document.getElementById('outputList');

        /**
         * Helper function to capitalize the first letter of each word in a string,
         * and convert the rest of the word to lowercase.
         * @param {string} str The input string.
         * @returns {string} The string with the first letter of each word capitalized and the rest lowercased.
         */
        function capitalizeFirstLetter(str) {
            // Split the string into words, process each word, and then join them back.
            return str.split(' ').map(word => {
                if (word.length === 0) {
                    return '';
                }
                // Capitalize the first letter and lowercase the rest of the word
                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }).join(' ');
        }

        /**
         * Event listener for the sort button click.
         * This function handles the entire logic of splitting, sorting, and joining the list.
         */
        sortButtonEl.addEventListener('click', () => {
            try {
                // Get raw input values
                const rawInputList = inputListEl.value;
                let inputSep = inputSeparatorEl.value;
                let outputSep = outputSeparatorEl.value;
                const shouldDeduplicate = deduplicateEl.checked;
                const capitalizationOption = capitalizationEl.value;
                const sortOrder = sortOrderEl.value;

                // Handle special characters for separators (e.g., '\n' for newline)
                inputSep = inputSep === '\\n' ? '\n' : inputSep;
                outputSep = outputSep === '\\n' ? '\n' : outputSep;

                // If input separator is empty, treat it as newline for splitting common use case
                if (inputSep === '') {
                    inputSep = '\n'; // Default to newline for splitting if user empties the input
                }

                // 1. Split the input list into an array of items.
                //    Use a regular expression to split by the separator,
                //    allowing for multiple separators or empty strings between valid items.
                let items = rawInputList.split(new RegExp(`\\s*${inputSep}\\s*`));

                // 2. Trim whitespace from each item and filter out any empty strings.
                items = items.map(item => item.trim()).filter(item => item !== '');

                // 3. Deduplicate the list if the option is checked.
                if (shouldDeduplicate) {
                    items = [...new Set(items)]; // Use Set to get unique items
                }

                // 4. Apply capitalization based on the selected option.
                // This step applies the chosen capitalization format to each item.
                if (capitalizationOption === 'uppercase') {
                    items = items.map(item => item.toUpperCase());
                } else if (capitalizationOption === 'lowercase') {
                    items = items.map(item => item.toLowerCase());
                } else if (capitalizationOption === 'capitalizeFirst') {
                    // Apply the corrected capitalizeFirstLetter function
                    items = items.map(item => capitalizeFirstLetter(item));
                }
                // If 'none', no change is applied.

                // 5. Sort the array alphabetically based on the selected order.
                // Note: Sorting happens *after* capitalization to ensure consistent alphabetical order based on the transformed string.
                if (sortOrder === 'ascending') {
                    items.sort((a, b) => a.localeCompare(b)); // Case-sensitive, locale-aware sort
                } else { // descending
                    items.sort((a, b) => b.localeCompare(a)); // Case-sensitive, locale-aware sort
                }

                // 6. Join the sorted array back into a single string using the output separator.
                const sortedOutput = items.join(outputSep);

                // 7. Display the result in the output textarea.
                outputListEl.value = sortedOutput;

            } catch (error) {
                // Basic error handling: display the error in the output area.
                outputListEl.value = `An error occurred: ${error.message}`;
                console.error("Error during list processing:", error);
            }
        });

        // Set a default example list for demonstration
        window.onload = () => {
            inputListEl.value = "";
            inputSeparatorEl.value = "";
            outputSeparatorEl.value = "";
            deduplicateEl.checked = true;
            capitalizationEl.value = "capitalizeFirst"; // Default to capitalize first letter
            sortOrderEl.value = "ascending";
            outputListEl.placeholder = "Click 'Sort List' to see the sorted output.";
        };
    </script>
</body>
</html>
