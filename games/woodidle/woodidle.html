<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumberjack Legends - Retro Woodcutter</title>
    <style>
        /* Retro-Themed CSS for Lumberjack Legends */
        :root {
            --retro-green: #33cc33;
            --dark-green: #004d00;
            --background-color: #000;
            --font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--background-color);
            color: var(--retro-green);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-size: 16px;
            /* Optional: Simulates CRT scanlines effect */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4) 1px, transparent 1px);
            background-size: 100% 2px;
        }

        #game-container {
            width: 90%;
            max-width: 600px;
            border: 3px solid var(--retro-green);
            box-shadow: 0 0 15px var(--retro-green);
            padding: 15px;
            margin: 20px;
            position: relative;
        }

        /* Title */
        #game-title {
            text-align: center;
            color: var(--retro-green);
            text-shadow: 0 0 5px var(--retro-green);
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 10px;
        }

        /* Top Bar: Level and XP */
        #top-bar {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed var(--retro-green);
            margin-bottom: 15px;
        }
        #xp-display, #level-display {
            font-weight: bold;
        }

        /* Main Area */
        #main-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Tree Section & Sprite Container */
        #tree-image-container {
            width: 150px;
            height: 150px;
            /* Remove dark-green background to show image */
            /* border: 2px solid var(--retro-green); /* Optional border */
            line-height: 150px;
            margin: 0 auto 10px;
            font-size: 0.9em;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--dark-green); /* Fallback/background for image area */
            border: 2px solid var(--retro-green);
        }

        #tree-sprite {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated; /* Essential for a good retro look! */
        }
        
        #tree-section {
            text-align: center;
        }

        /* Action Section */
        #cut-tree-button {
            background-color: var(--retro-green);
            color: var(--background-color);
            border: 2px solid var(--retro-green);
            padding: 10px 20px;
            cursor: pointer;
            font-family: var(--font-family);
            font-weight: bold;
            font-size: 1.1em;
            transition: background-color 0.1s;
            box-shadow: 2px 2px 0 var(--dark-green);
        }
        #cut-tree-button:hover:not(:disabled) {
            background-color: #66ff66;
        }
        #cut-tree-button:active:not(:disabled) {
            box-shadow: none;
            transform: translate(2px, 2px);
        }
        #cut-tree-button:disabled {
            cursor: not-allowed;
            background-color: var(--dark-green);
            color: #666;
            border-color: var(--dark-green);
        }

        /* Timer Bar */
        #timer-bar-container {
            width: 100%;
            max-width: 300px;
            height: 15px;
            background-color: var(--dark-green);
            border: 1px solid var(--retro-green);
            margin-top: 10px;
        }

        #timer-bar {
            height: 100%;
            width: 0%;
            background-color: var(--retro-green);
            transition: none;
        }

        #timer-text {
            margin-top: 5px;
            font-size: 0.9em;
        }

        /* Tree Select Buttons */
        #tree-select-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
        }

        .tree-button {
            background-color: var(--dark-green);
            color: var(--retro-green);
            border: 1px solid var(--retro-green);
            padding: 5px 10px;
            cursor: pointer;
            font-family: var(--font-family);
            font-size: 0.8em;
        }
        .tree-button:hover:not(:disabled) {
            background-color: var(--retro-green);
            color: var(--background-color);
        }
        .tree-button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            background-color: #1a1a1a;
        }
        .tree-button.active {
            background-color: var(--retro-green);
            color: var(--background-color);
            font-weight: bold;
        }

        /* Bottom Bar: Axe and Logs */
        #bottom-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 0 0;
            border-top: 1px dashed var(--retro-green);
            margin-top: 15px;
            font-size: 0.9em;
            position: relative;
        }

        /* Inventory Toggle Button */
        #inventory-toggle-button {
            position: absolute;
            bottom: 5px;
            right: 0;
            background: none;
            border: 1px solid var(--retro-green);
            color: var(--retro-green);
            padding: 2px 5px;
            cursor: pointer;
            font-family: var(--font-family);
            font-size: 0.8em;
            transform: translateY(100%);
        }
        #inventory-toggle-button:hover {
            background-color: var(--dark-green);
        }

        /* Inventory Window */
        #inventory {
            position: absolute;
            bottom: 30px;
            right: 0;
            width: 200px;
            max-height: 250px;
            overflow-y: auto;
            background-color: var(--dark-green);
            border: 2px solid var(--retro-green);
            padding: 10px;
            box-shadow: 0 0 10px var(--retro-green);
            display: none;
            z-index: 10;
        }
        #inventory.open {
            display: block;
        }
        #inventory h4 {
            margin: 0 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px dashed var(--retro-green);
            text-align: center;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        /* Notifications */
        #notifications {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            text-align: center;
            padding: 5px;
        }

        .notification-message {
            background-color: rgba(0, 77, 0, 0.9);
            border: 1px solid var(--retro-green);
            padding: 5px 10px;
            margin-bottom: 5px;
            display: inline-block;
            box-shadow: 0 0 5px var(--retro-green);
            animation: fadeout 3s forwards;
            opacity: 1;
        }

        @keyframes fadeout {
            0% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1 id="game-title">Lumberjack Legends</h1>

        <div id="top-bar">
            <span id="xp-display"></span>
            <span id="level-display"></span>
        </div>

        <div id="main-area">
            <div id="tree-section">
                <div id="tree-image-container">
                    <img id="tree-sprite" src="" alt="Current Tree Sprite">
                </div>
                <div id="tree-info">
                    <p>Current Tree: <span id="current-tree-name"></span></p>
                    <p>Required Level: <span id="required-level"></span></p>
                </div>
                <div id="tree-select-buttons">
                    </div>
            </div>

            <div id="action-section">
                <button id="cut-tree-button"></button>
                <div id="timer-bar-container">
                    <div id="timer-bar"></div>
                </div>
                <p id="timer-text">Ready to chop!</p>
            </div>
        </div>

        <div id="bottom-bar">
            <p id="axe-display"></p>
            <p id="logs-display">Total Logs: 0</p>
            <button id="inventory-toggle-button">Open Inventory</button>
        </div>

        <div id="inventory">
            <h4>Log Inventory</h4>
            <div id="inventory-list">
                </div>
        </div>

        <div id="notifications"></div>
    </div>

    <script>
        // --- Game Data Models ---

        // Define tree properties. Added 'sprite' property for file name handling.
		const TREES = {
		regular: { name: 'Regular', requiredLevel: 1,  baseTime: 3000, xp: 25,  sprite: 'regular-tree.png' },
		oak:     { name: 'Oak',     requiredLevel: 15, baseTime: 4500, xp: 35,  sprite: 'oak-tree.png' },
		willow:  { name: 'Willow',  requiredLevel: 30, baseTime: 6000, xp: 50,  sprite: 'willow-tree.png' },
		yew:     { name: 'Yew',     requiredLevel: 60, baseTime: 8000, xp: 70,  sprite: 'yew-tree.png' },
		redwood: { name: 'Redwood', requiredLevel: 90, baseTime: 12000,xp: 100, sprite: 'redwood-tree.png' }
		};
		
		const AXES = [
		{ name: 'Stone Axe',    requiredLevel: 1,  speedBoost: 0.00 },
		{ name: 'Bronze Axe',   requiredLevel: 10, speedBoost: 0.10 },
		{ name: 'Iron Axe',     requiredLevel: 25, speedBoost: 0.25 },
		{ name: 'Steel Axe',    requiredLevel: 45, speedBoost: 0.45 },
		{ name: 'Diamond Axe',  requiredLevel: 70, speedBoost: 0.80 },
		{ name: 'Ultimate Axe', requiredLevel: 95, speedBoost: 0.95 }
		];

        // Base path for the sprites folder
        const SPRITE_PATH = 'sprites/';

        // --- Leveling Formula ---
        function calculateXPForLevel(level) {
            if (level >= 99) return Infinity;
            const baseXP = 83;
            const exponent = 1.05;
            return Math.floor(baseXP * (level - 1) * Math.pow(level, exponent)) + baseXP;
        }

        // --- Game State ---
        let game = {
            level: 1,
            currentXP: 0,
            inventory: { 
                regular: 0, oak: 0, willow: 0, yew: 0, redwood: 0
            },
            currentTree: 'regular',
            currentAxe: AXES[0],
            isCutting: false,
            cutTimer: null,
            totalCutTime: 0,
            autoChop: true,
            isInventoryOpen: false,
        };

        // --- DOM Elements ---
        const D = {
            levelDisplay: document.getElementById('level-display'),
            xpDisplay: document.getElementById('xp-display'),
            currentTreeName: document.getElementById('current-tree-name'),
            requiredLevel: document.getElementById('required-level'),
            axeDisplay: document.getElementById('axe-display'),
            logsDisplay: document.getElementById('logs-display'),
            cutButton: document.getElementById('cut-tree-button'),
            timerBar: document.getElementById('timer-bar'),
            timerText: document.getElementById('timer-text'),
            treeSelectButtons: document.getElementById('tree-select-buttons'),
            notifications: document.getElementById('notifications'),
            treeSprite: document.getElementById('tree-sprite'), // Updated to target the <img> element
            inventoryWindow: document.getElementById('inventory'),
            inventoryList: document.getElementById('inventory-list'),
            inventoryToggleButton: document.getElementById('inventory-toggle-button'),
        };

        // --- Game Logic Functions ---

        /** Loads game state from localStorage or initializes default. */
        function loadGame() {
            const savedGame = localStorage.getItem('lumberjackLegends');
            if (savedGame) {
                const loadedData = JSON.parse(savedGame);
                Object.assign(game, loadedData);
                game.inventory = {...game.inventory, ...loadedData.inventory};
                game.currentAxe = determineBestAxe(game.level);
            }
            createTreeButtons();
            updateDisplay();
            updateInventoryDisplay();
        }

        /** Saves game state to localStorage. */
        function saveGame() {
            localStorage.setItem('lumberjackLegends', JSON.stringify({
                level: game.level,
                currentXP: game.currentXP,
                inventory: game.inventory,
                currentTree: game.currentTree,
            }));
        }

        /** Updates all visible game elements. */
        function updateDisplay() {
            // Level & XP
            const xpNeeded = calculateXPForLevel(game.level);
            const xpRemaining = xpNeeded - game.currentXP;

            D.levelDisplay.textContent = `Level: ${game.level} 🌳`;
            D.xpDisplay.textContent = game.level < 99 
                ? `XP to Lvl ${game.level + 1}: ${xpRemaining.toLocaleString()}`
                : 'MAX LEVEL! (99)';

            // Tree Info & Sprite
            const treeData = TREES[game.currentTree];
            D.currentTreeName.textContent = treeData.name;
            D.requiredLevel.textContent = treeData.requiredLevel;
            // --- SPRITE UPDATE LOGIC ---
            D.treeSprite.src = SPRITE_PATH + treeData.sprite;
            D.treeSprite.alt = `${treeData.name} Tree`;


            // Axe & Total Logs
            const boostPercentage = (game.currentAxe.speedBoost * 100).toFixed(0);
            D.axeDisplay.textContent = `Axe: ${game.currentAxe.name} (${boostPercentage}% speed boost)`;
            const totalLogs = Object.values(game.inventory).reduce((sum, count) => sum + count, 0);
            D.logsDisplay.textContent = `Total Logs: ${totalLogs.toLocaleString()}`;

            // Update button states
            const canChopTree = game.level >= treeData.requiredLevel;
            D.cutButton.disabled = game.isCutting || !canChopTree;
            D.cutButton.textContent = game.isCutting 
                ? 'Chopping...' 
                : (canChopTree ? 'Chop Tree!' : `Need Lvl ${treeData.requiredLevel}`);

            // Update tree buttons
            document.querySelectorAll('.tree-button').forEach(btn => {
                const treeKey = btn.dataset.tree;
                const reqLvl = TREES[treeKey].requiredLevel;
                btn.disabled = game.level < reqLvl;
                btn.classList.toggle('active', treeKey === game.currentTree);
            });

            saveGame();
        }

        /** Updates the inventory list display. */
        function updateInventoryDisplay() {
            let html = '';
            let hasLogs = false;
            for (const key in TREES) {
                const logCount = game.inventory[key];
                if (logCount > 0) {
                    hasLogs = true;
                    html += `
                        <div class="log-item">
                            <span>${TREES[key].name} Logs:</span>
                            <span>${logCount.toLocaleString()}</span>
                        </div>
                    `;
                }
            }
            D.inventoryList.innerHTML = hasLogs ? html : '<p>Inventory is empty.</p>';
        }

        /** Toggles the visibility of the inventory window. */
        function toggleInventory() {
            game.isInventoryOpen = !game.isInventoryOpen;
            D.inventoryWindow.classList.toggle('open', game.isInventoryOpen);
            D.inventoryToggleButton.textContent = game.isInventoryOpen ? 'Close Inventory' : 'Open Inventory';
            if (game.isInventoryOpen) {
                updateInventoryDisplay();
            }
        }

        /** Processes experience gain and checks for level up. */
        function gainXP(amount) {
            game.currentXP += amount;
            let leveledUp = false;

            while (game.level < 99 && game.currentXP >= calculateXPForLevel(game.level)) {
                game.level++;
                leveledUp = true;
            }

            if (leveledUp) {
                const oldAxe = game.currentAxe.name;
                game.currentAxe = determineBestAxe(game.level);

                if (game.currentAxe.name !== oldAxe) {
                    notify(`Axe unlocked! You are now using the ${game.currentAxe.name}! ⛏️`);
                }
                notify(`Congratulations! You reached Woodcutting Level ${game.level}! 🎉`);
                selectTree(game.currentTree);
            }

            updateDisplay();
        }

        /** Finds the best axe the player can currently use. */
        function determineBestAxe(level) {
            let bestAxe = AXES[0];
            for (const axe of AXES) {
                if (level >= axe.requiredLevel) {
                    bestAxe = axe;
                } else {
                    break;
                }
            }
            return bestAxe;
        }

        /** Calculates the actual time to cut based on tree and axe. */
        function getCalculatedCutTime() {
            const treeData = TREES[game.currentTree];
            return treeData.baseTime * (1 - game.currentAxe.speedBoost);
        }

        /** Starts the woodcutting action. */
        function startCutting() {
            if (game.isCutting || game.level < TREES[game.currentTree].requiredLevel) return;

            game.isCutting = true;
            game.totalCutTime = getCalculatedCutTime();
            let timeElapsed = 0;
            const interval = 50; 

            D.timerText.textContent = `Chopping ${TREES[game.currentTree].name}...`;
            
            if (game.cutTimer) clearInterval(game.cutTimer);

            game.cutTimer = setInterval(() => {
                timeElapsed += interval;
                const progress = (timeElapsed / game.totalCutTime) * 100;

                D.timerBar.style.width = `${Math.min(100, progress)}%`;

                if (timeElapsed >= game.totalCutTime) {
                    clearInterval(game.cutTimer);
                    game.cutTimer = null;
                    finishCutting();
                }
            }, interval);
            updateDisplay();
        }

        /** Finishes the woodcutting action. */
        function finishCutting() {
            game.isCutting = false;
            const treeData = TREES[game.currentTree];
            const treeKey = game.currentTree;

            game.inventory[treeKey]++; 
            gainXP(treeData.xp);

            D.timerBar.style.width = '0%';
            D.timerText.textContent = `Got a ${treeData.name} log! Ready to chop!`;
            notify(`+1 ${treeData.name} Log, +${treeData.xp} XP`);
            
            if (game.isInventoryOpen) {
                updateInventoryDisplay();
            }

            // Auto-restart logic
            if (game.autoChop && game.level >= treeData.requiredLevel) {
                setTimeout(startCutting, 500); 
            }
            updateDisplay();
        }

        /** Switches the currently selected tree. */
        function selectTree(treeKey) {
            const treeData = TREES[treeKey];

            if (game.level < treeData.requiredLevel) {
                notify(`You need Woodcutting Level ${treeData.requiredLevel} to chop ${treeData.name}.`);
                return;
            }

            // Stop any current chopping action
            if (game.isCutting) {
                clearInterval(game.cutTimer);
                game.cutTimer = null;
                game.isCutting = false;
                D.timerBar.style.width = '0%';
                D.timerText.textContent = `Switched tree. Ready to chop ${treeData.name}!`;
            }

            game.currentTree = treeKey;
            updateDisplay();
        }

        /** Creates the tree selection buttons dynamically. */
        function createTreeButtons() {
            D.treeSelectButtons.innerHTML = '';
            for (const key in TREES) {
                const tree = TREES[key];
                const button = document.createElement('button');
                button.className = 'tree-button';
                button.dataset.tree = key;
                button.textContent = `${tree.name} (Lvl ${tree.requiredLevel})`;
                button.addEventListener('click', () => selectTree(key));
                D.treeSelectButtons.appendChild(button);
            }
        }

        /** Displays a temporary notification message. */
        function notify(message) {
            const msgElement = document.createElement('div');
            msgElement.className = 'notification-message';
            msgElement.textContent = message;
            D.notifications.appendChild(msgElement);

            setTimeout(() => {
                if (msgElement.parentNode) {
                    msgElement.remove();
                }
            }, 3100);
        }

        // --- Initialization ---

        window.onload = () => {
            loadGame();
        };

        // Event Listeners
        D.cutButton.addEventListener('click', startCutting);
        D.inventoryToggleButton.addEventListener('click', toggleInventory);

        // Set up an automatic save every 10 seconds
        setInterval(saveGame, 10000);
    </script>
</body>

</html>
