<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f8ff; /* Light sky background */
            font-family: 'Inter', sans-serif;
            user-select: none;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #333;
        }

        #gameCanvas {
            display: block;
            background-color: #70c5ce; /* Flappy Bird Sky */
            /* Fixed canvas size for classic feel, will be scaled by CSS */
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 10 / 16;
        }

        #messageBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 24px 32px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 3px solid #ffcc00;
            cursor: pointer;
            z-index: 100;
            transition: opacity 0.3s;
        }

        #messageBox.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #messageBox h2 {
            font-size: 2rem;
            color: #d85f39;
            margin-bottom: 8px;
            font-weight: 700;
            text-shadow: 1px 1px 0 #fff;
        }

        #messageBox p {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 0;
        }

        .score-display {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            z-index: 50;
        }
    </style>
</head>
<body>

<div id="gameContainer" class="w-full max-w-sm">
    <canvas id="gameCanvas" width="300" height="480"></canvas>
    <div id="scoreDisplay" class="score-display">0</div>

    <div id="messageBox" class="text-white">
        <h2>Flappy Gemini</h2>
        <p>Click or tap to start and flap!</p>
    </div>
</div>

<script>
    // --- Configuration and Constants ---
    const CANVAS = document.getElementById('gameCanvas');
    const CTX = CANVAS.getContext('2d');
    const SCORE_DISPLAY = document.getElementById('scoreDisplay');
    const MESSAGE_BOX = document.getElementById('messageBox');

    // Game dimensions
    const WIDTH = CANVAS.width;
    const HEIGHT = CANVAS.height;

    // Bird constants
    const BIRD_SIZE = 24; // Simplified square hitbox
    const BIRD_X = 60;
    const GRAVITY = 0.5;
    const FLAP_VELOCITY = -8;
    const TERMINAL_VELOCITY = 10;

    // Pipe constants
    const PIPE_WIDTH = 50;
    const PIPE_GAP = 120; // Vertical gap
    const PIPE_SPEED = 3;
    const PIPE_SPAWN_INTERVAL = 140; // in frames

    // Colors
    const COLOR_BIRD = '#ffd43b'; // Yellow
    const COLOR_PIPE = '#74bf2e'; // Green
    const COLOR_BRIM = '#5c9925'; // Darker Green for brim
    const COLOR_GROUND = '#ded895'; // Brownish/Sand
    const COLOR_SKY = '#70c5ce';

    // Game State
    let currentState = 'READY'; // 'READY', 'PLAYING', 'OVER'
    let score = 0;
    let frames = 0;
    let groundHeight = 50; // Height of the mock ground layer
    let animationId = null;

    // Mock Asset Loading and Sound Functions
    // Since actual loading from local files is not possible, we log the action.
    const mockAssets = {
        background: { color: COLOR_SKY, status: 'LOADED' },
        birdSprite: { color: COLOR_BIRD, status: 'LOADED' },
        pipeSprites: { top: COLOR_PIPE, bottom: COLOR_PIPE, status: 'LOADED' },
        sounds: {
            flap: new Audio(), // Mock Audio object
            hit: new Audio(),
            score: new Audio(),
        }
    };

    function playSound(name) {
        // In a real game, this would load and play audio from the ./audio folder
        try {
            // const audio = mockAssets.sounds[name];
            // audio.src = `./audio/${name}.wav`;
            // audio.play().catch(() => {}); // Catch play errors
        } catch (e) {
            console.log(`[MOCK AUDIO] Playing sound: ${name}`);
        }
    }

    // --- Bird Object ---
    const bird = {
        y: HEIGHT / 2 - BIRD_SIZE / 2,
        velocity: 0,
        x: BIRD_X,
        size: BIRD_SIZE,

        draw() {
            CTX.fillStyle = COLOR_BIRD;
            CTX.fillRect(this.x, this.y, this.size, this.size);
            // Draw a simplified eye to represent the bird
            CTX.fillStyle = '#000000';
            CTX.fillRect(this.x + this.size * 0.7, this.y + this.size * 0.2, 3, 3);
        },

        update() {
            // Apply gravity
            this.velocity += GRAVITY;
            // Limit velocity (terminal velocity)
            this.velocity = Math.min(this.velocity, TERMINAL_VELOCITY);
            this.y += this.velocity;

            // Check for ground/ceiling collision
            if (this.y + this.size >= HEIGHT - groundHeight || this.y <= 0) {
                this.y = Math.min(this.y, HEIGHT - groundHeight - this.size);
                gameOver();
            }
        },

        flap() {
            this.velocity = FLAP_VELOCITY;
            playSound('flap');
        }
    };

    // --- Pipes Array and Logic ---
    let pipes = [];

    const pipeLogic = {
        // A simple function to generate a new pipe pair
        spawn() {
            // Random height for the top pipe
            // Top pipe height must allow space for the gap and the ground
            const minHeight = 50;
            const maxHeight = HEIGHT - groundHeight - PIPE_GAP - 50;
            const topPipeHeight = Math.floor(Math.random() * (maxHeight - minHeight) + minHeight);

            pipes.push({
                x: WIDTH,
                height: topPipeHeight, // This is the height of the top pipe section
                scored: false
            });
        },

        draw() {
            CTX.fillStyle = COLOR_PIPE;
            pipes.forEach(p => {
                // 1. Draw Top Pipe (The rectangle section)
                CTX.fillRect(p.x, 0, PIPE_WIDTH, p.height);

                // 2. Draw Top Pipe Brim (Flipped vertically as requested)
                const brimHeight = 15;
                const brimOverlap = 5;
                CTX.fillStyle = COLOR_BRIM;
                CTX.fillRect(p.x - brimOverlap, p.height - brimHeight, PIPE_WIDTH + brimOverlap * 2, brimHeight);

                // 3. Draw Bottom Pipe (The rectangle section)
                const bottomPipeY = p.height + PIPE_GAP;
                CTX.fillStyle = COLOR_PIPE;
                CTX.fillRect(p.x, bottomPipeY, PIPE_WIDTH, HEIGHT - groundHeight - bottomPipeY);

                // 4. Draw Bottom Pipe Brim
                CTX.fillStyle = COLOR_BRIM;
                CTX.fillRect(p.x - brimOverlap, bottomPipeY, PIPE_WIDTH + brimOverlap * 2, brimHeight);
            });
        },

        update() {
            // Move pipes
            pipes.forEach(p => p.x -= PIPE_SPEED);

            // Remove off-screen pipes
            pipes = pipes.filter(p => p.x > -PIPE_WIDTH);

            // Spawn new pipes
            if (currentState === 'PLAYING' && frames % PIPE_SPAWN_INTERVAL === 0) {
                this.spawn();
            }

            // Check for scoring
            pipes.forEach(p => {
                // Bird has passed the pipe's x position
                if (!p.scored && p.x + PIPE_WIDTH < bird.x) {
                    score++;
                    p.scored = true;
                    SCORE_DISPLAY.textContent = score;
                    playSound('score');
                }
            });
        }
    };

    // --- Game Functions ---

    function checkCollision() {
        // Check pipes
        for (let p of pipes) {
            // Horizontal check: bird overlaps pipe
            if (bird.x + bird.size > p.x && bird.x < p.x + PIPE_WIDTH) {
                const topPipeBottom = p.height;
                const bottomPipeTop = p.height + PIPE_GAP;

                // Vertical check: bird hits top pipe or bottom pipe
                if (bird.y < topPipeBottom || bird.y + bird.size > bottomPipeTop) {
                    gameOver();
                    return true;
                }
            }
        }
        return false;
    }

    function draw() {
        // Clear the canvas
        CTX.fillStyle = COLOR_SKY;
        CTX.fillRect(0, 0, WIDTH, HEIGHT);

        // Draw ground (Mock asset)
        CTX.fillStyle = COLOR_GROUND;
        CTX.fillRect(0, HEIGHT - groundHeight, WIDTH, groundHeight);

        // Draw pipes
        pipeLogic.draw();

        // Draw bird
        bird.draw();

        // Draw HUD score (handled by HTML element)
    }

    function update() {
        if (currentState !== 'PLAYING') return;

        frames++;
        bird.update();
        pipeLogic.update();
        checkCollision();
    }

    function loop() {
        update();
        draw();
        animationId = requestAnimationFrame(loop);
    }

    function startGame() {
        if (currentState !== 'PLAYING') {
            // Reset game state
            bird.y = HEIGHT / 2 - BIRD_SIZE / 2;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frames = 0;
            SCORE_DISPLAY.textContent = score;

            currentState = 'PLAYING';
            MESSAGE_BOX.classList.add('hidden');
            MESSAGE_BOX.innerHTML = "<h2>Flappy Gemini</h2><p>Click or tap to start and flap!</p>"; // Reset for next READY state

            // Start the game loop
            if (animationId) cancelAnimationFrame(animationId);
            loop();
        }
    }

    function gameOver() {
        if (currentState !== 'OVER') {
            playSound('hit');
            currentState = 'OVER';
            cancelAnimationFrame(animationId);

            MESSAGE_BOX.querySelector('h2').textContent = `Game Over!`;
            MESSAGE_BOX.querySelector('p').innerHTML = `Final Score: ${score}<br/>Click or tap to restart.`;
            MESSAGE_BOX.classList.remove('hidden');
        }
    }

    function handleInput() {
        if (currentState === 'READY' || currentState === 'OVER') {
            startGame();
            bird.flap();
        } else if (currentState === 'PLAYING') {
            bird.flap();
        }
    }

    // --- Event Listeners ---

    // Mouse/Touch input
    CANVAS.addEventListener('mousedown', handleInput);
    CANVAS.addEventListener('touchstart', handleInput);
    MESSAGE_BOX.addEventListener('click', handleInput);

    // Keyboard input (Spacebar)
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault(); // Prevent scrolling
            handleInput();
        }
    });

    // Initial setup to display the 'Ready' message
    window.onload = () => {
        // Show initial message
        MESSAGE_BOX.classList.remove('hidden');
        // Initial draw to show the bird in the ready position
        draw();
        console.log("Assets Mocked: Audio will log to console, sprites are drawn using canvas shapes/colors.");
    };

</script>

</body>
</html>
