<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Mouse Maze</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background-color: #000;
    font-family: 'Courier New', monospace;
    color: #0f0;
    user-select: none;
  }

  #scoreboard {
    margin-bottom: 10px;
    font-size: 1.5em;
  }

  #game-container {
    position: relative;
    width: 400px;
    height: 600px;
    border: 5px solid #0f0;
    box-shadow: 0 0 20px #0f0;
    background-color: #222;
    overflow: hidden;
  }

  #maze {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .wall {
    position: absolute;
    background-color: #ff00ff;
    box-shadow: 0 0 5px #ff00ff;
  }

  #start, #finish {
    position: absolute;
    width: 80px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  #start {
    bottom: 0;
    left: 10px;
    background-color: #00ff00;
    color: #000;
  }

  #finish {
    top: 0;
    right: 10px;
    background-color: #ffff00;
    color: #000;
  }

  #message {
    margin-top: 10px;
    font-size: 1.2em;
    height: 20px;
  }

  /* Game Over Screen Overlay */
  #game-over-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    color: #0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.5em;
    text-align: center;
    z-index: 10;
    display: none;
  }

  #restart-btn {
    margin-top: 20px;
    padding: 10px 20px;
    background-color: #0f0;
    color: #000;
    font-weight: bold;
    border: none;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    box-shadow: 0 0 10px #0f0;
  }

  #restart-btn:hover {
    background-color: #fff;
  }
</style>
</head>
<body>

<div id="scoreboard">SCORE: <span id="score">0</span></div>

<div id="game-container">
  <div id="maze">
    <div id="start">START</div>
    <div id="finish">FINISH</div>
  </div>

  <!-- Game Over Screen -->
  <div id="game-over-screen">
    <div id="game-over-text">GAME OVER!</div>
    <div id="final-score">Score: 0</div>
    <button id="restart-btn">RESTART</button>
  </div>
</div>

<div id="message">Move your mouse to START to begin!</div>

<script>
const gameContainer = document.getElementById('game-container');
const maze = document.getElementById('maze');
const startZone = document.getElementById('start');
const finishZone = document.getElementById('finish');
const scoreElement = document.getElementById('score');
const messageElement = document.getElementById('message');
const gameOverScreen = document.getElementById('game-over-screen');
const finalScoreElement = document.getElementById('final-score');
const restartButton = document.getElementById('restart-btn');

let score = 0;
let gameActive = false;

/* ------------------------------
   Maze Generation (DFS algorithm)
   ------------------------------ */
function generateMaze(rows, cols) {
  const grid = Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => ({ visited: false, walls: [true, true, true, true] }))
  );

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  const stack = [];
  const startRow = rows - 1;
  const startCol = 0;
  grid[startRow][startCol].visited = true;
  stack.push([startRow, startCol]);

  const directions = [
    [-1, 0, 0, 2], // up
    [0, 1, 1, 3],  // right
    [1, 0, 2, 0],  // down
    [0, -1, 3, 1], // left
  ];

  while (stack.length) {
    const [r, c] = stack[stack.length - 1];
    const shuffled = shuffle(directions.slice());
    let moved = false;

    for (const [dr, dc, wall, oppWall] of shuffled) {
      const nr = r + dr;
      const nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !grid[nr][nc].visited) {
        grid[r][c].walls[wall] = false;
        grid[nr][nc].walls[oppWall] = false;
        grid[nr][nc].visited = true;
        stack.push([nr, nc]);
        moved = true;
        break;
      }
    }

    if (!moved) stack.pop();
  }

  return grid;
}

/* ------------------------------
   Render Maze
   ------------------------------ */
function renderMaze() {
  maze.querySelectorAll('.wall').forEach(w => w.remove());

  const rows = 15;
  const cols = 10;
  const cellW = 400 / cols;
  const cellH = 600 / rows;
  const grid = generateMaze(rows, cols);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * cellW;
      const y = r * cellH;
      const cell = grid[r][c];
      if (cell.walls[0]) createWall(x, y, cellW, 4); // top
      if (cell.walls[1]) createWall(x + cellW - 4, y, 4, cellH); // right
      if (cell.walls[2]) createWall(x, y + cellH - 4, cellW, 4); // bottom
      if (cell.walls[3]) createWall(x, y, 4, cellH); // left
    }
  }
}

function createWall(x, y, w, h) {
  const wall = document.createElement('div');
  wall.className = 'wall';
  wall.style.left = `${x}px`;
  wall.style.top = `${y}px`;
  wall.style.width = `${w}px`;
  wall.style.height = `${h}px`;
  maze.appendChild(wall);
}

/* ------------------------------
   Collision + Game Logic
   ------------------------------ */
function isTouching(x, y, element) {
  const rect = element.getBoundingClientRect();
  const containerRect = gameContainer.getBoundingClientRect();
  const relativeX = x;
  const relativeY = y;
  return (
    relativeX > (rect.left - containerRect.left) &&
    relativeX < (rect.right - containerRect.left) &&
    relativeY > (rect.top - containerRect.top) &&
    relativeY < (rect.bottom - containerRect.top)
  );
}

function handleMouseMove(event) {
  if (!gameActive) return;
  const containerRect = gameContainer.getBoundingClientRect();
  const mouseX = event.clientX - containerRect.left;
  const mouseY = event.clientY - containerRect.top;

  const walls = document.querySelectorAll('.wall');
  for (const wall of walls) {
    if (isTouching(mouseX, mouseY, wall)) {
      triggerGameOver();
      return;
    }
  }

  if (isTouching(mouseX, mouseY, finishZone)) {
    pointScored();
  }
}

function startGame() {
  if (!gameActive) {
    gameActive = true;
    messageElement.textContent = "GO! Don't touch the magenta walls!";
    gameOverScreen.style.display = "none";
    gameContainer.addEventListener('mousemove', handleMouseMove);
  }
}

function triggerGameOver() {
  gameActive = false;
  gameContainer.removeEventListener('mousemove', handleMouseMove);
  finalScoreElement.textContent = `Score: ${score}`;
  gameOverScreen.style.display = "flex";
}

function pointScored() {
  score++;
  scoreElement.textContent = score;
  messageElement.textContent = `LEVEL COMPLETE! Score: ${score}`;
  gameActive = false;
  gameContainer.removeEventListener('mousemove', handleMouseMove);
  renderMaze();
}

function restartGame() {
  score = 0;
  scoreElement.textContent = score;
  messageElement.textContent = "Move your mouse to START to begin!";
  renderMaze();
  gameOverScreen.style.display = "none";
}

/* ------------------------------
   Initialization
   ------------------------------ */
renderMaze();

startZone.addEventListener('mouseenter', startGame);

gameContainer.addEventListener('mouseleave', () => {
  if (gameActive) {
    triggerGameOver();
  }
});

restartButton.addEventListener('click', restartGame);
</script>
</body>
</html>
