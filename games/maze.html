<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Maze Game</title>
<style>
    body {
        background: #111;
        color: #0f0;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
    }

    #maze {
        position: relative;
        width: 800px;
        height: 600px;
        background: #000;
        border: 3px solid #0f0;
        overflow: hidden;
        box-shadow: 0 0 20px #0f0;
    }

    /* Magenta maze walls */
    .cell {
        position: absolute;
        background: magenta;
        box-shadow: 0 0 6px magenta;
    }

    /* Start & Finish blocks - bright green */
    #start, #finish {
        position: absolute;
        width: 40px;
        height: 40px;
        line-height: 40px;
        text-align: center;
        font-weight: bold;
        border: 2px solid #0f0;
        border-radius: 5px;
        color: #000;
        background: #00ff00;
        box-shadow: 0 0 10px #0f0;
        z-index: 2;
        user-select: none;
    }

    #message {
        margin-top: 20px;
        color: #0f0;
    }

    #gameover {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9);
        color: #0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        display: none;
        z-index: 5;
    }

    #restartBtn {
        background: #0f0;
        color: #000;
        font-weight: bold;
        border: none;
        padding: 10px 20px;
        margin-top: 20px;
        cursor: pointer;
        font-family: monospace;
    }

    #restartBtn:hover {
        background: #9f9;
    }
</style>
</head>
<body>
    <h1>RETRO MAZE</h1>
    <div id="maze"></div>
    <div id="message"></div>

    <div id="gameover">
        <div id="finalText"></div>
        <button id="restartBtn">RESTART</button>
    </div>

<script>
const mazeEl = document.getElementById('maze');
const msg = document.getElementById('message');
const gameover = document.getElementById('gameover');
const finalText = document.getElementById('finalText');
const restartBtn = document.getElementById('restartBtn');

const rows = 15; // bigger grid (more cells = bigger maze)
const cols = 20;
const cellSize = 40;
let score = 0;

// directions for maze generation
const dirs = [
    {x:0, y:-1}, // up
    {x:1, y:0},  // right
    {x:0, y:1},  // down
    {x:-1, y:0}  // left
];

function shuffle(arr) {
    for (let i=arr.length-1; i>0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function generateMaze(r, c) {
    let grid = Array(r).fill().map(()=>Array(c).fill(1)); // 1 = wall
    function carve(x,y) {
        grid[y][x]=0;
        let shuffled = shuffle([...dirs]);
        for (let d of shuffled) {
            let nx = x + d.x*2;
            let ny = y + d.y*2;
            if (ny>=0 && ny<r && nx>=0 && nx<c && grid[ny][nx]===1) {
                grid[y+d.y][x+d.x]=0;
                carve(nx, ny);
            }
        }
    }
    carve(1,1);
    return grid;
}

function renderMaze() {
    mazeEl.innerHTML = '';
    const grid = generateMaze(rows, cols);

    // --- START/FINISH CONFIGURATION ---
    let startY = rows - 2;
    let startX = 1;
    let finishY = 1;
    let finishX = cols - 2;

    // 1. CARVE START CELL FREE (4 SIDES)
    // The maze generator ensures the cell itself (grid[startY][startX]) is open (0).
    // Now, ensure the cells immediately adjacent to the START cell are open too.
    // Left of START (x-1): Open if it's a passage cell.
    if (startX > 0) grid[startY][startX - 1] = 0;
    // Above START (y-1): Open if it's a passage cell.
    if (startY > 0) grid[startY - 1][startX] = 0;
    // Right of START (x+1): Open if it's a passage cell.
    if (startX < cols - 1) grid[startY][startX + 1] = 0;
    // Below START (y+1): This should be the outer wall. We handle this next.


    // 2. CREATE OUTER ENTRY GAP (Bottom Wall)
    // The START cell is at (startX, startY). The outer wall is at (startY+1).
    // The maze generator sets up the outer wall around the edge.
    // We break the wall at the bottom boundary cell directly below START.
    if (startY < rows - 1) {
        grid[startY + 1][startX] = 0; // The cell at the very bottom row, beneath the start, is now a passage.
    }

    // 3. Ensure the finish area is clear for the exit path
    grid[finishY][finishX] = 0;
    if (finishY > 0) grid[finishY - 1][finishX] = 0; // Open area above FINISH for mouse exit
    // --- END CONFIGURATION ---

    // render walls
    for (let y=0; y<rows; y++) {
        for (let x=0; x<cols; x++) {
            if (grid[y][x] === 1) {
                let div = document.createElement('div');
                div.classList.add('cell');
                div.style.left = (x*cellSize)+'px';
                div.style.top = (y*cellSize)+'px';
                div.style.width = cellSize+'px';
                div.style.height = cellSize+'px';
                mazeEl.appendChild(div);
            }
        }
    }

    // place start (bottom-left open cell)
    let start = document.createElement('div');
    start.id = 'start';
    start.style.left = startX*cellSize+'px';
    // Position START slightly lower to sit at the edge where the gap is, and be centered.
    start.style.top = startY*cellSize+'px';
    start.textContent = 'START';
    mazeEl.appendChild(start);

    // place finish (top-right open cell)
    let finish = document.createElement('div');
    finish.id = 'finish';
    finish.style.left = finishX*cellSize+'px';
    finish.style.top = finishY*cellSize+'px';
    finish.textContent = 'FINISH';
    mazeEl.appendChild(finish);

    // collision detection
    const walls = mazeEl.querySelectorAll('.cell');
    let startTouched = false;

    start.onmouseenter = () => {
        // Prevent accidental re-start before proper reset
        if (!startTouched) {
            startTouched = true;
            msg.textContent = 'Navigate to FINISH!';
        }
    };

    finish.onmouseenter = () => {
        if (startTouched) {
            score++;
            msg.textContent = 'LEVEL COMPLETE! Score: '+score;
            startTouched = false; // Must re-enter START to continue
            setTimeout(renderMaze, 1000);
        }
    };

    walls.forEach(w=>{
        w.onmouseenter = () => {
            if (startTouched) {
                msg.textContent = 'You hit a wall! Game Over.';
                showGameOver();
            }
        };
    });

    // Handle mouse leaving the whole maze area (boundary fail)
    mazeEl.onmouseleave = () => {
        if (startTouched) {
            msg.textContent = 'You left the maze boundary! Game Over.';
            showGameOver();
        }
    };
}

function showGameOver() {
    // Clear all mouse listeners to stop the game state
    // We don't need to explicitly remove them if we rely on the `startTouched` flag
    // and the `onmouseenter` handlers, but this is a good habit.
    gameover.style.display = 'flex';
    finalText.textContent = `GAME OVER — SCORE: ${score}`;
}

restartBtn.onclick = () => {
    gameover.style.display = 'none';
    score = 0;
    msg.textContent = '';
    renderMaze();
};

renderMaze();
</script>
</body>
</html>
