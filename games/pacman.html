<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Square Pac-Man</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Updated to match the generator's aesthetic */
  :root{
      --bg: #1a202c; /* Dark background from generator */
      --walls: #00008b; /* Navy Blue wall color from generator */
      --pac: #ffd166;
      --dot: #ffe3a7;
      --power: #ffcc00; /* Yellow power pellet/title color */
      --ghosts: #61dafb;
  }
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap');

  html,body{height:100%;margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Inter', system-ui, Segoe UI, Roboto; overflow: hidden;}
  canvas{image-rendering:pixelated;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,0.6); border: 2px solid #ffcc00;}
  .game-container{position:relative;} /* Wrapper for HUD elements */

  /* HUD Styles */
  .hud-container{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;color:#fff;text-shadow:1px 1px 2px #000;}
  .top-left, .top-right, .bottom-center{position:absolute;padding:10px;font-size:16px;font-weight:bold;display:flex;align-items:center; font-family: 'Press Start 2P', cursive;}
  .top-left{top:0;left:0;}
  .top-right{top:0;right:0;}
  .bottom-center{bottom:0;left:50%;transform:translateX(-50%);}
  .heart-icon{color:#ff4d4d;margin:0 2px;font-size:20px;} 

  /* Overlay for Pause/Ready/Continue */
  .overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:10;transition:opacity 0.3s; font-family: 'Press Start 2P', cursive;}
  .overlay button{background:var(--power);color:#000;padding:10px 20px;border-radius:8px;border:0;cursor:pointer;font-size:16px; box-shadow: 0 4px 0 #b38f00;}
  .overlay button:active { box-shadow: none; transform: translateY(4px); }
  .hidden{display:none;opacity:0;}

  /* General button styles for the main panel (kept from original) */
  .panel{color:#fff;width:260px;margin-left:18px;}
  h1{font-size:20px;margin:0 0 8px; color: var(--power); font-family: 'Press Start 2P', cursive;}
  .muted{opacity:0.8;font-size:13px; color: #a0aec0;}
  
  @media (max-width: 768px) {
    body {
        flex-direction: column;
        padding: 10px;
    }
    .panel {
        margin-left: 0;
        margin-top: 20px;
        width: 90%;
        max-width: 400px;
    }
  }
</style>
</head>
<body>
<div class="game-container">
  <canvas id="game" width="400" height="380"></canvas>
  <div id="game-overlay" class="overlay">
    <button id="ready-up-btn">Ready?</button>
    <button id="continue-btn" class="hidden">Continue</button>
  </div>
  <div class="hud-container">
    <div class="top-left">L: <span id="level-counter">1</span></div>
    <div class="top-right">S: <span id="point-counter">0</span></div>
    <div class="bottom-center" id="heart-counter">
      <span class="heart-icon">♥</span>
      <span class="heart-icon">♥</span>
      <span class="heart-icon">♥</span>
    </div>
  </div>
</div>
<div class="panel">
  <h1>Square Pac-Man</h1>
  <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
    <div class="muted">Press 'Ready?' to start. Press 'Continue' if you die.</div>
  </div>
</div>
<script>
// --- MAP GENERATION LOGIC ---

const ROWS = 19;
const COLS = 20;
const GHOST_GATE = { r: 8, c: 10 }; // [R8, C10]
const PACMAN_START = {x: 10.5, y: 15.5}; // Slightly offset to ensure proper centering
const GHOST_STARTS = [{x: 9.5, y: 9.5}, {x: 10.5, y: 9.5}, {x: 9.5, y: 10.5}, {x: 10.5, y: 10.5}]; 
const POWER_PELLET_LOCATIONS = [
    { r: 1, c: 1 }, 
    { r: 1, c: COLS - 2 }, 
    { r: ROWS - 2, c: 1 }, 
    { r: ROWS - 2, c: COLS - 2 } 
];

/* TILE KEY (Internal Generator Use):
    1: Map Border (Absolute solid)
    2: Inner Wall (Solid)
    0: Path / Empty Tunnel
    P: Pellet
    O: Power Pellet
    QWER: Ghost Spawn Floor (treated as 0 in game map)
    */

class PacmanMazeGenerator {
    constructor(rows, cols) {
        this.rows = rows;
        this.cols = cols;
        this.grid = [];
    }

    initGrid() {
        this.grid = [];
        for (let r = 0; r < this.rows; r++) {
            const row = [];
            for (let c = 0; c < this.cols; c++) {
                if (r === 0 || r === this.rows - 1 || c === 0 || c === this.cols - 1) {
                    row.push('1'); // Border wall
                } else {
                    row.push('2'); // Inner wall
                }
            }
            this.grid.push(row);
        }
    }

    placeGhostHouse() {
        const gateR = GHOST_GATE.r;
        const gateC = GHOST_GATE.c;

        // Coordinates based on the fixed structure requested by user
        const houseLayout = [
            // Inner Ghost Spawn Floor
            { r: gateR + 1, c: gateC, tile: 'Q' }, // Blinky's start
            { r: gateR + 1, c: gateC + 1, tile: 'W' }, 
            { r: gateR + 2, c: gateC, tile: 'E' }, // Pinky's start
            { r: gateR + 2, c: gateC + 1, tile: 'R' },
            // Inner path (0) tiles in the ghost house
            { r: gateR + 1, c: gateC - 1, tile: '0' },
            { r: gateR + 1, c: gateC + 2, tile: '0' },
            { r: gateR + 2, c: gateC - 1, tile: '0' },
            { r: gateR + 2, c: gateC + 2, tile: '0' },
            { r: gateR + 3, c: gateC, tile: '0' }, 
            { r: gateR + 3, c: gateC + 1, tile: '0' },

        ];

        // 1. Ghost House Walls Perimeter (Using an 8x5 solid block centered around the gate)
        const wallStartC = gateC - 4;
        const wallEndC = gateC + 5; // C15
        const wallStartR = gateR - 1;
        const wallEndR = gateR + 4; // R12

        for (let r = wallStartR; r <= wallEndR; r++) {
            for (let c = wallStartC; c <= wallEndC; c++) {
                // Ensure walls are not borders
                if (r > 0 && r < this.rows - 1 && c > 0 && c < this.cols - 1) {
                    this.grid[r][c] = '2';
                }
            }
        }
        
        // 2. Open up the inner area and apply the fixed ghost floor/paths
        houseLayout.forEach(pos => {
            this.grid[pos.r][pos.c] = pos.tile;
        });

        // 3. Gate Opening
        this.grid[gateR][gateC] = '0'; // Gate opening path at R8, C10
        this.grid[gateR][gateC + 1] = '0'; // Gate opening path at R8, C11
        
        // Ensure the path *leading to* the gate is carved out (0)
        // Path above the ghost house
        for(let c = gateC - 3; c <= gateC + 4; c++) {
            this.grid[gateR][c] = '0';
        }
    }

    carveMaze(r, c) {
        const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
        this.shuffle(directions);

        for (const [dr, dc] of directions) {
            const nextR = r + dr * 2;
            const nextC = c + dc * 2;
            const wallR = r + dr;
            const wallC = c + dc;

            if (
                nextR > 0 && nextR < this.rows - 1 &&
                nextC > 0 && nextC < this.cols - 1 &&
                this.grid[nextR][nextC] === '2'
            ) {
                // Define the fixed ghost house boundary to prevent carving through its perimeter
                const isCarvingHousePerimeter = (
                    wallR >= GHOST_GATE.r - 1 && wallR <= GHOST_GATE.r + 4 &&
                    wallC >= GHOST_GATE.c - 4 && wallC <= GHOST_GATE.c + 5
                );

                if (!isCarvingHousePerimeter) {
                    this.grid[wallR][wallC] = '0';
                    this.grid[nextR][nextC] = '0';
                    this.carveMaze(nextR, nextC);
                }
            }
        }
    }

    shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
    
    // --- NEW: Add loops to break dead ends and ensure connectivity ---
    connectMaze() {
        // Target 15% chance for a wall block to be converted into a path, 
        // effectively introducing loops and breaking up long dead ends.
        const LOOP_FACTOR = 0.15; 

        for (let r = 2; r < this.rows - 2; r++) {
            for (let c = 2; c < this.cols - 2; c++) {
                // Check if it's currently an inner wall tile and a random chance succeeds
                if (this.grid[r][c] === '2' && Math.random() < LOOP_FACTOR) {
                    
                    // Ghost House Boundary Check: DO NOT open walls inside the ghost house perimeter
                    const isHouseWall = (
                        r >= GHOST_GATE.r - 1 && r <= GHOST_GATE.r + 4 &&
                        c >= GHOST_GATE.c - 4 && c <= GHOST_GATE.c + 5
                    );

                    if (!isHouseWall) {
                        // Check if opening this wall would connect two existing path sections (0, P, O)
                        const isPath = (val) => val === '0' || val === 'P' || val === 'O';
                        
                        let openNeighbors = 0;
                        if (isPath(this.grid[r-1][c])) openNeighbors++;
                        if (isPath(this.grid[r+1][c])) openNeighbors++;
                        if (isPath(this.grid[r][c-1])) openNeighbors++;
                        if (isPath(this.grid[r][c+1])) openNeighbors++;

                        // Only convert the wall to a path if it has at least one path neighbor
                        // to ensure it creates a useful loop/connection.
                        if (openNeighbors >= 1) { 
                             this.grid[r][c] = '0'; // Open the path
                        }
                    }
                }
            }
        }
    }
    
    placePellets() {
        for (let r = 1; r < this.rows - 1; r++) {
            for (let c = 1; c < this.cols - 1; c++) {
                // Place standard pellets ('P') where there's an empty path ('0')
                if (this.grid[r][c] === '0') {
                    this.grid[r][c] = 'P';
                }
            }
        }

        // Place Power Pellets ('O') at fixed corner locations, overwriting 'P'
        POWER_PELLET_LOCATIONS.forEach(pos => {
            const tile = this.grid[pos.r][pos.c];
            if (tile !== '1' && tile !== '2') { 
                 this.grid[pos.r][pos.c] = 'O';
            }
        });
        
        // Ensure the ghost gate opening is an empty path '0' (no pellet)
        this.grid[GHOST_GATE.r][GHOST_GATE.c] = '0';
        this.grid[GHOST_GATE.r][GHOST_GATE.c + 1] = '0'; 
    }

    generateMap() {
        this.initGrid();
        this.placeGhostHouse();

        // 1. Carve initial maze structure
        const startR = 3; 
        const startC = 3; 
        this.grid[startR][startC] = '0';
        this.carveMaze(startR, startC);

        // 2. Introduce loops to maximize connectivity
        this.connectMaze();

        // 3. Place pellets in all open paths
        this.placePellets();

        // Convert the 2D array back to an array of strings for game consumption
        return this.grid.map(row => row.join(''));
    }
}

// --- GAME SETUP & MAP LOGIC ---

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// UI Elements
const scoreEl = document.getElementById('point-counter');
const heartCounterEl = document.getElementById('heart-counter');
const levelCounterEl = document.getElementById('level-counter');
const overlayEl = document.getElementById('game-overlay');
const readyBtn = document.getElementById('ready-up-btn');
const continueBtn = document.getElementById('continue-btn');

const TILE = 20; // px
const WIDTH = COLS * TILE;
const HEIGHT = ROWS * TILE;
canvas.width = WIDTH; canvas.height = HEIGHT;

let map = [];
let totalPellets = 0; 

// Entities
const player = {x:0, y:0, dir:{x:0,y:0}, nextDir:{x:0,y:0}, speed:0.12, radius:TILE*0.45, mouth:0.3};
const ghosts = [];
const ghostColors = ['#ff0000','#ffb8ff','#00ffff','#ffb852']; // Red, Pink, Cyan, Orange

let score = 0;
let lives = 3;
let currentLevel = 0;
let running = false; // Game logic is running
let paused = true; // Game is paused (start, game over, continue)

let frightenedTimer = 0;

// --- UTILITY FUNCTIONS FOR PATHING ---

const ALIGN_TOLERANCE = 0.05; 

/**
 * Returns the map value at the given tile coordinates.
 */
function tileAt(x, y) {
  const c = Math.floor(x), r = Math.floor(y); 
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return 1; // Treat out of bounds as wall
  return map[r][c];
}

/**
 * Checks if a specific tile coordinate is a walkable path (0, 2, or 3).
 * * 0: Path/Gate, 2: Pellet, 3: Power Pellet, 1: Wall
 */
function canMove(x, y) {
  const v = tileAt(x, y);
  return (v === 0 || v === 2 || v === 3);
}


function loadLevel() {
  // --- Dynamic Maze Generation ---
  const generator = new PacmanMazeGenerator(ROWS, COLS);
  const generatedMapString = generator.generateMap();

  // Convert the generated string map to the numeric map used by the game
  map = generatedMapString.map(row => row.split('').map(char => {
    switch(char) {
      case '1': return 1; // Border Wall
      case '2': return 1; // Inner Wall (solid wall)
      case 'P': return 2; // Pellet
      case 'O': return 3; // Power Pellet
      case '0': 
      case 'Q': case 'W': case 'E': case 'R': return 0; // Path/Gate/Ghost spawn tiles
      case ' ': return 0; // Empty path (shouldn't happen with generator, but safety)
      default: return 0;
    }
  }));

  totalPellets = 0;
  // Recalculate pellet count after reset 
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (map[r][c] === 2 || map[r][c] === 3) {
        totalPellets++;
      }
    }
  }
}

function createGhosts() {
  ghosts.length = 0;
  // Ghost starts are slightly offset from tile center to avoid instant collision at start
  GHOST_STARTS.forEach((start, i) => {
    ghosts.push({
      x: start.x, y: start.y,
      dir: {x: 0, y: 0},
      speed: 0.09 + i * 0.005, // Slight speed variation
      state: 'scatter',
      color: ghostColors[i],
      fright: false
    });
  });
}

function resetGame() {
  currentLevel = 0;
  score = 0;
  lives = 3;
  resetLevel();
  showOverlay('ready');
}

function resetLevel(newLevel = false) {
  if (newLevel) {
    currentLevel++;
  }
  loadLevel();
  createGhosts();

  // Reset Pac-Man Position
  player.x = PACMAN_START.x; 
  player.y = PACMAN_START.y;
  player.dir = {x: 0, y: 0};
  player.nextDir = {x: 0, y: 0};

  frightenedTimer = 0;
  
  // Ensure Pac-Man's spawn tile is clear of any pellets (set to 0)
  map[Math.floor(player.y)][Math.floor(player.x)] = 0; 
  
  setUI();
}


function setUI() {
  scoreEl.textContent = score;
  levelCounterEl.textContent = currentLevel + 1;
  heartCounterEl.innerHTML = Array(lives).fill('<span class="heart-icon">♥</span>').join('');
}

function showOverlay(state) {
  paused = true;
  overlayEl.classList.remove('hidden');
  readyBtn.classList.add('hidden');
  continueBtn.classList.add('hidden');

  if (state === 'ready') {
    readyBtn.classList.remove('hidden');
  } else if (state === 'continue') {
    continueBtn.textContent = `Continue (L: ${lives})`;
    continueBtn.classList.remove('hidden');
  } else if (state === 'game-over') {
    continueBtn.textContent = 'Game Over. Restart?';
    continueBtn.classList.remove('hidden');
  }
}

function hideOverlay() {
  paused = false;
  overlayEl.classList.add('hidden');
}

// --- CONTROLS ---

readyBtn.onclick = () => {
  if (!running) { // First start
    running = true;
    resetGame();
  }
  resetLevel();
  hideOverlay();
};

continueBtn.onclick = () => {
  if (lives > 0 && continueBtn.textContent.includes('Continue')) {
    resetLevel(false); 
    hideOverlay();
  } else {
    // Game over / Restart
    resetGame();
  }
};

const keysHeld = { left:false, right:false, up:false, down:false };

window.addEventListener("keydown", e => {
  if (!running || paused) return;
  if (e.key === "ArrowLeft") keysHeld.left = true;
  if (e.key === "ArrowRight") keysHeld.right = true;
  if (e.key === "ArrowUp") keysHeld.up = true;
  if (e.key === "ArrowDown") keysHeld.down = true;
});

window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft") keysHeld.left = false;
  if (e.key === "ArrowRight") keysHeld.right = false;
  if (e.key === "ArrowUp") keysHeld.up = false;
  if (e.key === "ArrowDown") keysHeld.down = false;
});

function getHeldDir() {
  if (keysHeld.left) return {x:-1, y:0};
  if (keysHeld.right) return {x:1, y:0};
  if (keysHeld.up) return {x:0, y:-1};
  if (keysHeld.down) return {x:0, y:1};
  return null;
}

function isCentered(x, y) {
  const isXCentered = Math.abs(x - (Math.floor(x) + 0.5)) < ALIGN_TOLERANCE;
  const isYCentered = Math.abs(y - (Math.floor(y) + 0.5)) < ALIGN_TOLERANCE;
  return isXCentered && isYCentered;
}

// --- GAME LOGIC UPDATE ---

function updatePlayer(delta) {
  const speed = player.speed * 24;

  // FIX: Correctly get the current tile index (the whole number part of the coordinate)
  const currentTileX = Math.floor(player.x); 
  const currentTileY = Math.floor(player.y); 

  // Update buffered direction from held keys
  const held = getHeldDir();
  if (held) player.nextDir = held;
  
  // 1. Try to turn (only possible near center of a tile)
  if ((player.nextDir.x || player.nextDir.y) && isCentered(player.x, player.y)) {
    const d = player.nextDir;
    
    // Check the destination tile (current tile index + direction)
    const tx = currentTileX + d.x; 
    const ty = currentTileY + d.y; 

    if (canMove(tx, ty)) {
        player.dir = d;
    }
  }

  // 2. Move forward
  const nextX = player.x + player.dir.x * speed * delta;
  const nextY = player.y + player.dir.y * speed * delta;
  
  // Check collision for the tile Pac-Man will enter if he moves
  const checkX = nextX + player.dir.x * 0.45;
  const checkY = nextY + player.dir.y * 0.45;

  if (player.dir.x !== 0) {
      if (canMove(checkX, player.y)) {
          player.x = nextX;
      } else {
          // Snap to center and stop if blocked
          player.x = currentTileX + 0.5; // Snap to center of current tile index
          player.dir.x = 0;
      }
  }

  if (player.dir.y !== 0) {
      if (canMove(player.x, checkY)) {
          player.y = nextY;
      } else {
          // Snap to center and stop if blocked
          player.y = currentTileY + 0.5; // Snap to center of current tile index
          player.dir.y = 0;
      }
  }

  // Handle warping (e.g., tunnel on map border, though not explicitly in this generator)
  if (player.x < 0) player.x = COLS - 1;
  if (player.x >= COLS) player.x = 0;


  // 3. Eat dots/pellets
  const pr = Math.floor(player.y), pc = Math.floor(player.x);
  if (map[pr] && (map[pr][pc] === 2 || map[pr][pc] === 3)) {
    if (map[pr][pc] === 2) score += 1; 
    if (map[pr][pc] === 3) {
      score += 10;
      frightenedTimer = 8;
      ghosts.forEach(g => {
        g.fright = true;
        g.state = 'frightened';
      });
    }
    map[pr][pc] = 0;
    totalPellets--;
    setUI();
  }
}

// Simple pathfinding (BFS) used by ghosts
function findPath(sx, sy, tx, ty) {
  const visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  const queue = [{x: sx, y: sy, path: []}];
  visited[sy][sx] = true;

  while (queue.length > 0) {
    const {x, y, path} = queue.shift();
    if (x === tx && y === ty) return path;

    for (const d of [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]) {
      const nx = x + d.x;
      const ny = y + d.y;
      
      // Ensure we don't treat the wall boundary between the house and the gate as walkable
      const isWallTile = tileAt(nx, ny) === 1;

      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !visited[ny][nx] && canMove(nx, ny) && !isWallTile) {
        visited[ny][nx] = true;
        queue.push({x: nx, y: ny, path: [...path, d]});
      }
    }
  }
  return []; 
}

// --- Ghost personality chasing ---
function updateGhost(g, i, delta) {
  const sp = g.speed * 24;

  const cx = Math.floor(g.x);
  const cy = Math.floor(g.y);
  const px = Math.floor(player.x);
  const py = Math.floor(player.y);

  // Default target is scatter corner (top-left for 0, top-right for 1, etc.)
  let target = {x: COLS-2, y: 1}; 
  if (i === 0) target = {x: 1, y: 1};
  if (i === 1) target = {x: COLS-2, y: 1};
  if (i === 2) target = {x: 1, y: ROWS-2};
  if (i === 3) target = {x: COLS-2, y: ROWS-2};
  
  if (!g.fright) {
     target = {x: px, y: py}; // Default to chasing Pac-Man
  }
  // No complex targeting implemented, just simple chase/scatter/frightened

  // If centered, decide new direction using pathfinding
  if (isCentered(g.x, g.y)) {
    const path = findPath(cx, cy, target.x, target.y);
    if (path.length > 0) {
      g.dir = path[0]; // take first step in path
    }
  }

  // Move forward
  const nx = g.x + g.dir.x * sp * delta;
  const ny = g.y + g.dir.y * sp * delta;

  if (g.dir.x !== 0) {
    if (canMove(nx + g.dir.x * 0.45, g.y)) g.x = nx;
    else g.dir.x = 0;
  }
  if (g.dir.y !== 0) {
    if (canMove(g.x, ny + g.dir.y * 0.45)) g.y = ny;
    else g.dir.y = 0;
  }

  // Warping (if needed)
  if (g.x < 0) g.x = COLS - 1;
  if (g.x >= COLS) g.x = 0;
}


function update(dt) {
  const delta = dt * 0.001;

  updatePlayer(delta);

  // 1. Ghost Update & Movement
  frightenedTimer = Math.max(0, frightenedTimer - delta);
  if (frightenedTimer <= 0) ghosts.forEach(g => {
    g.fright = false;
    if (g.state !== 'eaten') g.state = 'scatter';
  });
  
  ghosts.forEach((g,i) => updateGhost(g,i,delta));

	// 2. Collision Check
	const COLLISION_THRESHOLD = 0.8; 

	for (let i = 0; i < ghosts.length; i++) {
		const g = ghosts[i];
		const dist = Math.hypot(g.x - player.x, g.y - player.y);

		if (dist < COLLISION_THRESHOLD) {
			if (g.fright) {
				// PAC-MAN EATS GHOST
				score += 20; 
				
				// Reset ghost to start house
				const start = GHOST_STARTS[i];
				g.x = start.x;
				g.y = start.y;
				g.dir = {x: 0, y: 0};
				g.fright = false; 
				g.state = 'eaten';
				
				setUI();
			} else {
				// GHOST EATS PAC-MAN
				lives--;
				setUI();
				
				if (lives <= 0) {
					showOverlay('game-over');
				} else {
					showOverlay('continue');
				}
				return;
			}
		}
	}

  // 3. Level Up Check
  if (totalPellets <= 0) {
    resetLevel(true); 
  }
}

// --- DRAWING LOGIC ---

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  // Draw Map
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const v = map[r][c];
      const x = c * TILE, y = r * TILE;
      
      // Use wall colors from the generator aesthetic
      if (v === 1) { // Wall
        ctx.fillStyle = '#00008b'; // Navy Blue
        ctx.fillRect(x, y, TILE, TILE);
      } else if (v === 2) { // Pellet
        ctx.fillStyle = '#ffe3a7';
        ctx.fillRect(x + TILE / 2 - 2, y + TILE / 2 - 2, 4, 4);
      } else if (v === 3) { // Power Pellet
        ctx.fillStyle = '#ffcc00'; // Yellow
        // Flashing effect for power pellet
        if (Math.floor(performance.now() / 250) % 2 === 0) {
            ctx.fillRect(x + TILE / 4, y + TILE / 4, TILE / 2, TILE / 2);
        }
      }
    }
  }

  // Draw Player (Square Pac-Man)
    const rectW = TILE * 0.5;
    const rectH = TILE * 0.5;
    // Player coordinates are now centered on the tile (e.g., 10.5, 15.5)
    const px = player.x * TILE - rectW / 2;
    const py = player.y * TILE - rectH / 2;

    ctx.fillStyle = 'yellow';
    ctx.fillRect(px, py, rectW, rectH);


  // Draw Ghosts (Rectangle Ghosts)
  ghosts.forEach(g => {
    // Ghost coordinates are centered on the tile (e.g., 9.5, 9.5)
    const gx = g.x * TILE, gy = g.y * TILE;
    const rectW = TILE * 0.9;
    const rectH = TILE * 0.9;
    
    // Frightened ghosts are blue/white flashing
    if (g.fright && (frightenedTimer > 2 || Math.floor(frightenedTimer * 10) % 2 === 0)) {
      ctx.fillStyle = '#87cefa'; // Light Blue
    } else if (g.fright && frightenedTimer <= 2) {
      ctx.fillStyle = Math.floor(frightenedTimer * 10) % 2 === 0 ? '#87cefa' : '#ffffff'; // Flashing blue/white
    } else {
      ctx.fillStyle = g.color; // Normal color
    }
    
    // Draw ghost body centered at the continuous x,y
    ctx.fillRect(gx - rectW/2, gy - rectH/2, rectW, rectH);

    // Eyes (simplified square eyes)
    ctx.fillStyle = '#fff';
    ctx.fillRect(gx - TILE * 0.35, gy - TILE * 0.3, TILE * 0.3, TILE * 0.3);
    ctx.fillRect(gx + TILE * 0.05, gy - TILE * 0.3, TILE * 0.3, TILE * 0.3);
  });
}

// --- MAIN LOOP ---

let last = performance.now();
function loop(now) {
  const dt = (now - last);
  last = now;
  if (running && !paused) {
    update(dt);
  }
  draw();
  requestAnimationFrame(loop);
}

// Initial setup
resetGame();
requestAnimationFrame(loop);
</script>
